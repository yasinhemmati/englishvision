  background:linear-gradient(135deg,var(--primary-ghost),#fff);
  border:1px solid var(--primary-pale);border-radius:var(--radius);padding:.85rem;
}
.occasion-fa{font-size:.85rem;color:var(--text-dark);margin-bottom:.55rem;font-weight:500;line-height:1.5}
.occasion-input-row{display:flex;align-items:center;gap:.5rem}
.occasion-month{
  font-family:var(--font-en);direction:ltr;font-weight:600;color:var(--primary);
  background:#fff;padding:.35rem .65rem;border-radius:6px;font-size:.85rem;
}

/* IMAGE-JOB-MATCH */
.job-match-container{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;align-items:start}
.job-images{display:flex;flex-direction:column;gap:.65rem}
.job-image-card{
  background:linear-gradient(135deg,var(--primary-ghost),#fff);
  border:1px solid var(--primary-pale);border-radius:var(--radius);
  padding:.85rem;display:flex;align-items:center;gap:.85rem;
}
.job-icon{font-size:2rem;flex-shrink:0}
.job-fa{font-size:.85rem;color:var(--text-mid)}
.job-words{display:flex;flex-direction:column;gap:.5rem}
.job-word-card{
  padding:.7rem 1rem;background:var(--bg-soft);border:2px solid var(--border-light);
  border-radius:var(--radius);font-family:var(--font-en);direction:ltr;font-weight:500;
  cursor:pointer;text-align:center;transition:all .2s;
}
.job-word-card:hover{border-color:var(--primary)}
.job-word-card.selected{background:var(--accent);color:#fff;border-color:var(--accent)}

/* READING-QUESTIONS */
.reading-questions{display:flex;flex-direction:column;gap:1rem;margin-top:1rem}
.reading-question{padding:.85rem 1rem;background:var(--bg-soft);border-radius:var(--radius)}
.rq-question{font-family:var(--font-en);direction:ltr;font-size:.92rem;font-weight:500;margin-bottom:.55rem;color:var(--text-dark)}
.rq-hint{font-size:.78rem;color:var(--success);margin-top:.5rem;padding-top:.5rem;border-top:1px dashed var(--border-light);font-style:italic}

/* READING-MCQ */
.reading-mcq-question{padding:1rem;background:var(--bg-soft);border-radius:var(--radius);margin-bottom:.85rem}
.rq-options{display:flex;flex-direction:column;gap:.4rem;margin-top:.5rem}
.rq-option{
  display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;background:#fff;
  border:1px solid var(--border-light);border-radius:6px;cursor:pointer;font-size:.85rem;
}
.rq-option:hover{background:var(--primary-ghost);border-color:var(--primary-pale)}
.rq-option input{accent-color:var(--primary)}
.rq-option span{font-family:var(--font-en);direction:ltr}

/* SHORT-ANSWER (riddles) */
.riddles-list{display:flex;flex-direction:column;gap:.6rem}
.riddle-row{
  display:grid;grid-template-columns:auto 1fr auto auto;gap:.65rem;align-items:center;
  padding:.55rem .85rem;background:var(--bg-soft);border-radius:var(--radius);
}
.riddle-bullet{color:var(--primary)}
.riddle-question{font-size:.85rem;color:var(--text-dark)}
.riddle-input{width:120px;text-align:center;font-weight:600}
.riddle-hint{
  font-family:var(--font-en);direction:ltr;color:var(--success);font-weight:600;
  background:var(--success-bg);padding:.3rem .65rem;border-radius:99px;font-size:.78rem;
}

/* COLOR-SURVEY (uses wb-table) */

/* ACTIVITY-PLACE-GRID */
.activity-place-table th{text-align:center}
.activity-place-table input[type="checkbox"]{accent-color:var(--success);width:18px;height:18px}

/* TRANSLATE-ROOMS */
.rooms-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.85rem}
.room-card{
  background:linear-gradient(135deg,var(--primary-ghost),#fff);
  border:1px solid var(--primary-pale);border-radius:var(--radius);padding:.85rem;
}
.room-en{font-family:var(--font-display);direction:ltr;color:var(--primary);font-weight:600;text-align:center;margin-bottom:.55rem;font-size:1.05rem}

/* FIND-EQUIVALENT */
.bilingual-text{display:grid;grid-template-columns:1fr 1fr;gap:.85rem;margin-bottom:1rem}
.bilingual-fa,.bilingual-en{
  padding:1rem 1.15rem;border-radius:var(--radius);line-height:2;font-size:.88rem;
}
.bilingual-fa{background:linear-gradient(135deg,var(--primary-ghost),#fff);border:1px solid var(--primary-pale);color:var(--text-dark)}
.bilingual-en{background:linear-gradient(135deg,var(--accent-light),#fff);border:1px solid #F4D89B;font-family:var(--font-en);direction:ltr;color:var(--text-dark)}
.example-answer{font-family:var(--font-en);direction:ltr;color:var(--success);font-weight:600;background:var(--success-bg);padding:.3rem .65rem;border-radius:6px;display:inline-block}

/* ADDRESS-TRANSLATE */
.envelope{
  background:linear-gradient(135deg,#FFF7E0,#fff);border:2px dashed var(--accent);
  border-radius:var(--radius-lg);padding:1.25rem;font-family:var(--font-en);direction:ltr;
}
.envelope-section{margin-bottom:.85rem;font-size:.88rem;line-height:1.6}

/* POSTER-FORM */
.poster-info{
  background:var(--bg-soft);border-right:3px solid var(--primary);border-radius:var(--radius);
  padding:1rem 1.25rem;margin-bottom:1rem;
}
.poster-fa-line{font-size:.88rem;color:var(--text-dark);padding:.2rem 0;line-height:1.6}
.poster-form-card{
  background:linear-gradient(135deg,var(--primary-ghost),#fff);
  border:2px solid var(--primary-pale);border-radius:var(--radius);
  padding:1.25rem;direction:ltr;
}
.poster-form-title{
  font-family:var(--font-display);text-align:center;color:var(--primary);
  font-weight:700;font-size:1.15rem;margin-bottom:1rem;
}
.poster-form-card .form-row{margin-bottom:.85rem}
.poster-form-card label{font-size:.78rem;color:var(--text-mid);display:block;margin-bottom:.25rem;font-family:var(--font-en);direction:ltr;text-align:left}

/* FOOD-PREFERENCE */
.food-pref-grid{display:grid;grid-template-columns:2fr 1fr;gap:1rem}
.food-pref-section{background:var(--bg-soft);border-radius:var(--radius);padding:.85rem}
.food-pref-head{font-family:var(--font-en);direction:ltr;font-weight:600;color:var(--primary);text-align:center;margin-bottom:.65rem;padding-bottom:.55rem;border-bottom:1px solid var(--border-light)}
.food-pref-row{display:flex;gap:.4rem;margin-bottom:.4rem;flex-wrap:wrap;justify-content:center}
.food-pref-list{display:flex;flex-direction:column;gap:.4rem}
.food-chip{
  display:flex;align-items:center;gap:.4rem;padding:.4rem .75rem;background:#fff;
  border:1px solid var(--border-light);border-radius:99px;cursor:pointer;font-size:.82rem;
}
.food-chip:hover{border-color:var(--primary-pale)}
.food-chip input{accent-color:var(--primary)}
.food-chip span{font-family:var(--font-en);direction:ltr}

/* IMAGE-FLASHCARDS */
.image-flashcard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.85rem}
.image-flashcard{
  background:linear-gradient(135deg,var(--primary-ghost),#fff);
  border:1px solid var(--primary-pale);border-radius:var(--radius);
  padding:.85rem;text-align:center;
}
.image-flashcard-emoji{font-size:3rem;margin-bottom:.55rem;line-height:1}

@media (max-width:600px){
  .bilingual-text{grid-template-columns:1fr}
  .job-match-container{grid-template-columns:1fr;gap:1rem}
  .food-pref-grid{grid-template-columns:1fr}
  .match-line-container{grid-template-columns:1fr;gap:1rem}
  .number-grid{grid-template-columns:repeat(8,1fr)}
  .occasions-grid{grid-template-columns:1fr}
  .riddle-row{grid-template-columns:auto 1fr;gap:.4rem}
  .riddle-input{grid-column:1 / -1;width:100%}
  .riddle-hint{grid-column:1 / -1}
  .word-slots{grid-template-columns:1fr}
}

.exercise{background:#fff;border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:1.5rem;margin-bottom:1rem}
.exercise-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;padding-bottom:.85rem;border-bottom:1px solid var(--border-light);gap:.5rem;flex-wrap:wrap}
.exercise-num{font-family:var(--font-display);font-size:.92rem;font-weight:600;color:var(--primary)}
.exercise-type{font-size:.7rem;color:var(--text-soft);background:var(--bg-soft);padding:3px 9px;border-radius:99px}
.exercise-question{font-size:.95rem;color:var(--text-dark);margin-bottom:.5rem;font-family:var(--font-en);direction:ltr;line-height:1.6;text-align:left}
.exercise-question-fa{font-size:.82rem;color:var(--text-mid);margin-bottom:1rem;line-height:1.6;text-align:right}
.exercise-options{display:flex;flex-direction:column;gap:.5rem}
.option-btn{padding:.85rem 1rem;border:1.5px solid var(--border-light);border-radius:var(--radius);background:#fff;cursor:pointer;font-family:var(--font-en);font-size:.88rem;direction:ltr;text-align:left;transition:all .2s;display:flex;align-items:center;gap:.75rem;color:var(--text-dark)}
.option-btn:hover{border-color:var(--primary-pale);background:var(--primary-ghost)}
.option-btn.selected{border-color:var(--primary);background:var(--primary-ghost)}
.option-btn.correct{border-color:var(--success);background:var(--success-bg)}
.option-btn.wrong{border-color:var(--danger);background:var(--danger-bg)}
.option-letter{width:24px;height:24px;border-radius:50%;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.75rem;flex-shrink:0;color:var(--text-mid)}
.option-btn.correct .option-letter{background:var(--success);color:#fff}
.option-btn.wrong .option-letter{background:var(--danger);color:#fff}
.exercise-feedback{margin-top:1rem;padding:.85rem 1rem;border-radius:var(--radius);font-size:.85rem;display:none}
.exercise-feedback.show{display:block;animation:fadeInUp .3s}
.exercise-feedback.correct{background:var(--success-bg);color:var(--success);border:1px solid #B5D88A}
.exercise-feedback.wrong{background:var(--danger-bg);color:var(--danger);border:1px solid #E8B0B0}
.exercise-actions{margin-top:1rem;display:flex;gap:.5rem;justify-content:flex-end}
.btn-check{padding:.55rem 1.4rem;background:var(--primary);color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:var(--font-fa);font-size:.85rem;font-weight:500}
.btn-check:hover{background:var(--primary-light)}
.btn-check:disabled{opacity:.5;cursor:not-allowed}

.lesson-footer{margin:1.5rem auto 0;display:flex;justify-content:space-between;gap:1rem;max-width:1280px;padding:0 1.5rem 4rem}
.footer-btn{flex:1;padding:.95rem 1.15rem;background:#fff;border:1px solid var(--border-light);border-radius:var(--radius);cursor:pointer;font-family:var(--font-fa);display:flex;align-items:center;gap:.85rem;transition:all .2s;text-align:right;text-decoration:none;color:inherit}
.footer-btn:hover:not(.disabled){border-color:var(--primary-pale);transform:translateY(-2px);box-shadow:var(--shadow)}
.footer-btn.next{flex-direction:row-reverse;text-align:left}
.footer-btn .arrow{font-size:1.2rem;color:var(--primary)}
.footer-btn .label{font-size:.7rem;color:var(--text-soft)}
.footer-btn .title{font-size:.88rem;font-weight:600;color:var(--text-dark)}
.footer-btn.disabled{opacity:.4;cursor:not-allowed}

@media (max-width:960px){
  .lesson-body{grid-template-columns:1fr;padding:1rem 1rem 1rem;margin-top:0}
  .sidebar{display:none}
  .lesson-footer{padding:0 1rem 6rem}
  .mobile-nav-trigger{display:flex;align-items:center;justify-content:space-between;gap:.85rem;position:fixed;bottom:1rem;left:1rem;right:1rem;z-index:100;background:var(--primary);color:#fff;padding:.85rem 1.15rem;border-radius:var(--radius);box-shadow:var(--shadow-lg);cursor:pointer;border:none;font-family:var(--font-fa)}
  .mobile-nav-trigger .label{font-size:.78rem;opacity:.9}
  .mobile-nav-trigger .current{font-size:.95rem;font-weight:600}
  .mobile-nav-trigger .icon{font-size:1.25rem}
  .bottom-sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;display:none}
  .bottom-sheet-overlay.active{display:block;animation:fadeInUp .25s}
  .bottom-sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:var(--radius-lg) var(--radius-lg) 0 0;z-index:201;transform:translateY(100%);transition:transform .3s;max-height:80vh;overflow-y:auto}
  .bottom-sheet.active{transform:translateY(0)}
  .bottom-sheet-handle{width:40px;height:4px;background:var(--border);border-radius:99px;margin:.85rem auto .5rem}
}
@media (max-width:768px){
  .tab-panel{padding:1.5rem}
  .vocab-grid{grid-template-columns:1fr 1fr;gap:.65rem}
  .practice-row,.practice-trans-line{grid-template-columns:1fr;gap:.5rem}
  .practice-arrow{transform:rotate(90deg);align-self:center}
  .practice-trans-arrow{display:none}
  .conv-card{padding:1rem}
  .footer-btn{padding:.7rem .85rem}
  .footer-btn .label{display:none}
  .vocab-card{padding:1rem}
  .letter-display{font-size:3.5rem}
  .dropzone-pair{grid-template-columns:1fr}
}
@media (max-width:480px){
  .vocab-grid{grid-template-columns:1fr}
  .letters-grid{grid-template-columns:1fr 1fr}
}

/* ═══════════ DUOLINGO — حذف این بلوک = برگشت کامل ═══════════ */
:root{
  /* بازتعریفِ توکن‌های هویتی → پالت Duolingo (سراسری) */
  --accent:#58CC02 !important;
  --accent-light:#E8F9DC !important;
  --accent-glow:#E8F9DC !important;
  --primary:#58CC02 !important;
  --primary-light:#49AD00 !important;
  --primary-pale:#D7F0C2 !important;
  --primary-ghost:#EAF7E0 !important;
  --ink:#3C3C3C !important;
  --ink-light:#777777 !important;
  --text-soft:#777777 !important;
  --green:#58CC02 !important;
  --border:#E5E5E5 !important;
  --border-light:#E5E5E5 !important;
  --paper:#FFFFFF !important;
  --paper-warm:#FFFFFF !important;
  --paper-cream:#F7F7F7 !important;
  /* توکن‌های اختصاصی این تم */
  --du-g:#58CC02; --du-gh:#49AD00; --du-gs:#58A700;
  --du-blue:#1CB0F6; --du-yel:#FFC800; --du-red:#FF4B4B; --du-pur:#CE82FF; --du-orange:#FF9600;
  --du-ink:#3C3C3C; --du-mut:#777777; --du-border:#E5E5E5; --du-s1:#F7F7F7;
  --du-r-sm:8px; --du-r-md:12px; --du-r-lg:20px; --du-r-xl:28px;
  --du-ease:cubic-bezier(0.34,1.56,0.64,1);
}

/* ── سطح و متنِ ضخیم (Duo هیچ‌جا نازک نیست) ── */
body{ background:#FFFFFF !important; color:#3C3C3C !important; }
body,p,span,div,a,li,td,th,label,button,input{ font-weight:700; }
h1,h2,h3,h4,.lesson-card-en,.grade-card-title,.section-title,.header-title{
  font-weight:800 !important; letter-spacing:-.01em !important;
}
.lesson-card-fa,.review-strip-fa,.section-desc,.lesson-card-desc{ font-weight:700 !important; }

/* ── کارت‌ها: خطِ ضخیم + سایه‌ی فیزیکیِ پایین (نه سایه‌ی نرم) ── */
.lesson-card,.grade-card,.tool-card{
  border:2px solid #E5E5E5 !important;
  border-radius:var(--du-r-lg) !important;
  box-shadow:0 2px 0 #E5E5E5 !important;
  transition:transform .12s var(--du-ease), box-shadow .12s, border-color .12s !important;
}
.lesson-card:hover,.grade-card:hover,.tool-card:hover{
  transform:translateY(-2px) !important;
  border-color:#58CC02 !important;
  box-shadow:0 4px 0 #CFE8BA !important;
}
.lesson-card::before{ background:#58CC02 !important; height:5px !important; }

/* بنرِ کارت درس: سطحِ روشن، شماره و آیکن درشت */
.lesson-card-banner{ background:#F7F7F7 !important; border-bottom:2px solid #E5E5E5 !important; padding:1.3rem 1.3rem 1rem !important; }
.lesson-card-num{ color:#3C3C3C !important; opacity:.22 !important; font-weight:800 !important; }
.lesson-card-icon{ opacity:.85 !important; font-size:1.7rem !important; }

/* ── نوار مرور: کاشیِ ضخیمِ سبز-لهجه، سایه‌ی فیزیکی ── */
.review-strip{
  background:#FFFFFF !important;
  color:#3C3C3C !important;
  border:2px solid #E5E5E5 !important;
  border-radius:var(--du-r-lg) !important;
  box-shadow:0 2px 0 #E5E5E5 !important;
  transition:transform .12s var(--du-ease), box-shadow .12s !important;
}
.review-strip:hover{ transform:translateY(-2px) !important; box-shadow:0 4px 0 #CFE8BA !important; border-color:#58CC02 !important; }
.review-strip-title{ color:#3C3C3C !important; font-weight:800 !important; }
.review-strip-fa{ color:#777777 !important; }
.review-strip-icon{ background:#E8F9DC !important; color:#256B14 !important; border-radius:var(--du-r-md) !important; }
.review-strip-arrow{ color:#256B14 !important; }
.review-strip.done{ background:#E8F9DC !important; border-color:#58CC02 !important; }
.review-strip.done .review-strip-title{ color:#fff !important; }
.review-strip.done .review-strip-icon{ background:#58CC02 !important; color:#fff !important; }

/* ── دکمه‌ی اصلی = CTA سه‌بعدیِ Duo که با کلیک فرو می‌رود ── */
.btn-primary,.btn-check,.footer-btn.next,.audio-play{
  background:#58CC02 !important; color:#fff !important;
  border:none !important; border-radius:var(--du-r-md) !important;
  box-shadow:0 4px 0 #58A700 !important;
  font-weight:800 !important; text-transform:none !important;
  transition:transform .08s, box-shadow .08s, background .12s !important;
}
.btn-primary:hover,.btn-check:hover,.footer-btn.next:hover{ background:#49AD00 !important; }
.btn-primary:active,.btn-check:active,.footer-btn.next:active,.audio-play:active{
  transform:translateY(4px) !important; box-shadow:0 0 0 #58A700 !important;
}
/* دکمه‌ی ثانویه = کاشیِ سفیدِ خط‌ضخیم با سایه‌ی فیزیکی */
.btn-secondary,.btn-practice,.footer-btn.prev{
  background:#fff !important; color:#3C3C3C !important;
  border:2px solid #E5E5E5 !important; border-radius:var(--du-r-md) !important;
  box-shadow:0 2px 0 #E5E5E5 !important; font-weight:800 !important;
  transition:transform .08s, box-shadow .08s !important;
}
.btn-secondary:active,.btn-practice:active,.footer-btn.prev:active{ transform:translateY(2px) !important; box-shadow:0 0 0 #E5E5E5 !important; }
.audio-play{ border-radius:50% !important; }

/* ── نوار XP/پیشرفت: پیلِ سبزِ پُر ── */
.progress-fill,.vocab-progress-fill,.sidebar-progress-fill,.ev-card-progress > i,
.progress-bar-fill,[class*="progress"] [class*="fill"]{
  background:#58CC02 !important; border-radius:9999px !important;
}
.progress-bar,.ev-card-progress{ border-radius:9999px !important; background:#EBEBEB !important; }
.progress-circle{ color:#58CC02 !important; }

/* ── ناوبری: تبِ فعال سبزِ پُر، گرد ── */
.nav-link.active{ background:#58CC02 !important; color:#fff !important; border-radius:var(--du-r-md) !important; box-shadow:0 3px 0 #58A700 !important; }
.nav-link:hover{ color:#256B14 !important; }
.brand-glyph{ background:#58CC02 !important; color:#fff !important; border-radius:var(--du-r-md) !important; box-shadow:0 3px 0 #58A700 !important; }

/* ── لینک/های‌لایتِ ثانویه = آبیِ Duo ── */
.sl-highlight,.word.highlight,mark:not(.ev-highlight){ background:#D7F0FF !important; color:#3C3C3C !important; border-radius:6px !important; }

/* ── سایدبارِ درس: کاشیِ خط‌ضخیم، آیتم فعال سبز ── */
.sidebar{ border:2px solid #E5E5E5 !important; border-radius:var(--du-r-lg) !important; box-shadow:0 2px 0 #E5E5E5 !important; }
.sidebar-item.active,.tab-btn.active{ background:#E8F9DC !important; color:#256B14 !important; border-radius:var(--du-r-md) !important; font-weight:800 !important; }
.sidebar-item.active .sidebar-icon{ color:#256B14 !important; }

/* ── کارت‌های محتوا ── */
.conv-card,.quiz-card,.practice-statements,.visual-panel,.sl-example,.rc-passage,.progress-card{
  border:2px solid #E5E5E5 !important; border-radius:var(--du-r-md) !important; box-shadow:0 2px 0 #E5E5E5 !important;
}
.audio-bar{ border:2px solid #E5E5E5 !important; border-radius:var(--du-r-md) !important; }

/* ── پیل/برچسب‌ها + برچسبِ زنده ── */
.badge,.pill,.tag,.chip{ border-radius:9999px !important; font-weight:800 !important; }
.badge-live,.status-live,.live-badge{ background:#FF9600 !important; color:#fff !important; }

/* ── کتاب‌های hero: سایه‌ی فیزیکیِ درشت ── */
.tome{ box-shadow:0 8px 0 rgba(0,0,0,.12), 0 16px 32px -12px rgba(0,0,0,.25) !important; }

/* ── ناوبری چسبان ── */
.nav,.top-nav{ background:rgba(255,255,255,.92) !important; border-bottom:2px solid #E5E5E5 !important; }

/* ── احترام به کاهشِ حرکت: فنریت/پرش خاموش ── */
@media (prefers-reduced-motion: reduce){
  .lesson-card,.grade-card,.tool-card,.review-strip,
  .btn-primary,.btn-check,.btn-secondary,.btn-practice,.footer-btn,.audio-play{
    transition:none !important;
  }
  .lesson-card:hover,.grade-card:hover,.tool-card:hover,.review-strip:hover{ transform:none !important; }
  .btn-primary:active,.btn-check:active,.footer-btn.next:active,
  .btn-secondary:active,.btn-practice:active,.footer-btn.prev:active,.audio-play:active{ transform:none !important; }
}

/* ── اصلاح کنتراست: متنِ آبی فقط برای لینک‌های متنیِ درون‌خطی، نه روی سطوح رنگی ── */
a.ev-resume, a.ev-resume *, .review-strip, .review-strip *,
.lesson-card *, .tool-card *, .grade-card *, .nav-link, .footer-btn, .footer-btn *,
.btn-primary, .btn-secondary, .btn-check, .btn-practice{ color:inherit; }
/* کارت ادامه و هر سطحِ سبز: متنِ سفیدِ خوانا */
.ev-resume{ color:#fff !important; }
.ev-resume .ev-r-kicker,.ev-resume .ev-r-title,.ev-resume .ev-r-sub{ color:#fff !important; }
.ev-resume .ev-r-ic{ background:rgba(255,255,255,.22) !important; color:#fff !important; }
.ev-resume .ev-r-arrow{ color:#fff !important; }
/* فتودیکشنری/هدرهای سکشن‌دار: سطحِ تختِ سبز + متن سفید (نه گرادیانِ تیره) */
.dict-section-head{ background:#58CC02 !important; color:#fff !important; }

<script>
/* لوگوی آپلودی: اگر images/logo.* موجود باشد، جای متنِ EV نشان داده می‌شود */
(function(){
  var brands=document.querySelectorAll('.brand,.navbar-brand');
  if(!brands.length) return;
  // عمقِ مسیر: چند پوشه از ریشه فاصله داریم؟ (لندینگ=0، gradeN=1)
  var depth=(location.pathname.match(/grade\d+\//)?1:0);
  var prefix='../'.repeat(depth);
  var exts=['png','jpg','jpeg','webp','svg'];
  var i=0;
  function tryNext(){
    if(i>=exts.length) return;
    var src=prefix+'images/logo.'+exts[i];
    var probe=new Image();
    probe.onload=function(){
      brands.forEach(function(b){
        if(b.querySelector('.ev-logo-img')) return;
        var img=document.createElement('img');
        img.src=src; img.alt='English Vision'; img.className='ev-logo-img';
        b.insertBefore(img,b.firstChild);
        b.classList.add('ev-has-logo');
      });
      document.documentElement.classList.add('ev-has-logo');
    };
    probe.onerror=function(){ i++; tryNext(); };
    probe.src=src;
  }
  tryNext();
})();
</script>
