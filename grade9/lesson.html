<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">درس — پایه نهم</title>
<link rel="stylesheet" href="shared.css">
<style>
.lesson-body{max-width:1280px;margin:0 auto;padding:1.5rem 1.5rem 2rem;position:relative;z-index:5;display:grid;grid-template-columns:280px 1fr;gap:1.5rem;align-items:flex-start}

.sidebar{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow);border:1px solid var(--border-light);overflow:hidden;position:sticky;top:5rem}
.sidebar-head{padding:1.25rem 1.25rem .85rem;border-bottom:1px solid var(--border-light)}
.sidebar-head h3{font-size:.95rem;font-weight:700;color:var(--text-dark);margin-bottom:.25rem}
.sidebar-head p{font-size:.78rem;color:var(--text-soft)}
.sidebar-progress{padding:.85rem 1.25rem;background:linear-gradient(135deg,var(--primary-ghost) 0%,#fff 100%);border-bottom:1px solid var(--border-light)}
.sidebar-progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.sidebar-progress-label{font-size:.78rem;color:var(--text-mid)}
.sidebar-progress-value{font-size:.85rem;font-weight:700;color:var(--primary);font-family:var(--font-en)}
.sidebar-progress-bar{height:6px;background:var(--border-light);border-radius:99px;overflow:hidden}
.sidebar-progress-fill{height:100%;background:linear-gradient(90deg,var(--primary) 0%,var(--primary-soft) 100%);border-radius:99px;transition:width .5s;width:0%}
.sidebar-list{list-style:none;padding:.5rem;display:flex;flex-direction:column;gap:.15rem}
.sidebar-item{display:flex;align-items:center;gap:.75rem;padding:.75rem .85rem;border-radius:8px;cursor:pointer;transition:all .2s;color:var(--text-mid);font-size:.85rem;border:none;background:transparent;font-family:var(--font-fa);text-align:right;width:100%}
.sidebar-item:hover{background:var(--bg-soft);color:var(--primary)}
.sidebar-item.active{background:var(--primary-ghost);color:var(--primary);font-weight:600}
.sidebar-item.completed .sidebar-icon-wrap{background:var(--success);color:#fff;font-size:0}
.sidebar-item.completed .sidebar-icon-wrap::before{content:'✓';font-size:.85rem}
.sidebar-icon-wrap{width:30px;height:30px;border-radius:8px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-size:.95rem}
.sidebar-item.active .sidebar-icon-wrap{background:var(--primary);color:#fff}
.sidebar-text{flex:1;text-align:right}
.sidebar-text-en{font-size:.7rem;color:var(--text-soft);font-family:var(--font-en);direction:ltr;text-align:left;margin-top:1px;display:block}
.sidebar-item.active .sidebar-text-en{color:var(--primary-soft);opacity:.8}

.mobile-nav-trigger{display:none}

.content-area{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow);border:1px solid var(--border-light);overflow:hidden;min-height:400px}
.tab-panel{display:none;padding:2.5rem;animation:fadeInUp .3s ease}
.tab-panel.active{display:block}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.section-head{margin-bottom:1.75rem;padding-bottom:1.25rem;border-bottom:1px solid var(--border-light)}
.section-head h2{font-family:var(--font-display);font-size:1.7rem;font-weight:700;color:var(--text-dark);margin-bottom:.4rem;unicode-bidi:plaintext;text-align:start}
.section-head .section-fa{font-size:1rem;color:var(--text-mid);font-weight:500}
.section-head .section-desc{font-size:.88rem;color:var(--text-soft);margin-top:.6rem;line-height:1.7}

.translation-toggle{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem;padding:.75rem .9rem;background:var(--bg-soft);border-radius:var(--radius);border:1px solid var(--border-light)}
.translation-toggle .label{font-size:.82rem;color:var(--text-mid);margin-left:auto;align-self:center;display:flex;align-items:center;gap:.4rem}
.toggle-pill{padding:.4rem .85rem;font-size:.76rem;border-radius:100px;border:1px solid var(--border);background:#fff;cursor:pointer;font-family:var(--font-fa);transition:all .2s;color:var(--text-mid)}
.toggle-pill:hover{border-color:var(--primary-pale);color:var(--primary)}
.toggle-pill.active{background:var(--primary);border-color:var(--primary);color:#fff}

.phrase-banner{background:linear-gradient(135deg,var(--accent-light) 0%,#fff 100%);border:1px solid #F4D89B;border-radius:8px;padding:.5rem .7rem;margin-bottom:.6rem;font-size:.74rem;color:#8B5C0F;display:flex;align-items:center;gap:.4rem}
.phrase-banner svg{width:14px;height:14px;flex-shrink:0}
.phrase-pill{display:inline-block;background:#fff;border:1px solid var(--accent);padding:.25rem .55rem;border-radius:99px;font-family:var(--font-en);direction:ltr;color:var(--accent);font-weight:600;font-size:.78rem;margin:.3rem 0}

.conv-card{background:linear-gradient(180deg,#fff 0%,var(--bg-soft) 100%);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:1.5rem;margin-bottom:1.25rem}
.audio-bar{display:flex;align-items:center;gap:.85rem;padding:.7rem 1rem;background:#fff;border:1px solid var(--border-light);border-radius:100px;margin-bottom:1.25rem;box-shadow:0 2px 8px rgba(12,68,124,0.04)}
.audio-play{width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.audio-play:hover{background:var(--primary-light);transform:scale(1.05)}
.audio-bar .progress{flex:1;height:4px;background:var(--border-light);border-radius:99px;overflow:hidden}
.audio-bar .progress-fill{height:100%;width:0%;background:var(--primary);border-radius:99px}
.audio-bar .time{font-size:.75rem;color:var(--text-mid);font-family:var(--font-en)}

.conv-line{display:flex;gap:.85rem;padding:.75rem .5rem;border-bottom:1px dashed var(--border-light);align-items:flex-start;border-radius:6px;transition:background .15s;direction:ltr;text-align:left}
.conv-line:last-child{border-bottom:none}
.conv-line:hover{background:rgba(230,241,251,0.4)}
.conv-speaker{font-weight:600;color:var(--accent);font-size:.88rem;min-width:75px;font-family:var(--font-en);direction:ltr;text-align:left;flex-shrink:0}
.conv-speaker.teacher{color:var(--primary)}
.conv-speaker.student{color:var(--success-soft)}
.conv-content{flex:1;min-width:0;direction:ltr;text-align:left}
.conv-en{font-family:var(--font-en);font-size:.98rem;color:var(--text-dark);direction:ltr;line-height:1.65;text-align:left}
.conv-en .word{cursor:pointer;border-bottom:1px dotted transparent;transition:all .15s;padding:0 1px;border-radius:3px}
.conv-en .word:hover{background:var(--accent-light);border-bottom-color:var(--accent)}
.conv-en .word.in-phrase{background:linear-gradient(180deg,transparent 60%,var(--accent-light) 60%);border-bottom:1px dotted var(--accent)}
.conv-en .word.in-phrase:hover{background:linear-gradient(180deg,var(--accent-light) 0%,var(--accent-light) 100%)}
.conv-fa{font-size:.85rem;color:var(--text-mid);margin-top:.35rem;display:none;padding:.4rem .75rem;background:var(--bg-soft);border-right:3px solid var(--primary-pale);border-radius:6px;line-height:1.6;text-align:right}
.conv-line.show-fa .conv-fa{display:block;animation:fadeInUp .25s}
.conv-line .play-line{width:26px;height:26px;border-radius:50%;background:var(--bg-soft);border:1px solid var(--border-light);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-mid);font-size:.65rem;transition:all .2s;flex-shrink:0}
.conv-line .play-line:hover{background:var(--primary);color:#fff;border-color:var(--primary)}

.word-popup{position:absolute;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.15rem;box-shadow:var(--shadow-lg);min-width:240px;max-width:340px;z-index:200;display:none}
.word-popup.show{display:block;animation:fadeInUp .2s}
.word-popup .word-en{font-family:var(--font-en);font-size:1.15rem;font-weight:700;color:var(--primary);direction:ltr}
.word-popup .word-pos{display:inline-block;font-size:.65rem;color:var(--text-soft);background:var(--bg-soft);padding:2px 8px;border-radius:99px;margin-right:.5rem;font-family:var(--font-en)}
.word-popup .word-ipa{font-family:var(--font-en);font-size:.82rem;color:var(--text-mid);direction:ltr;margin-top:.2rem}
.word-popup .word-fa{margin-top:.55rem;padding-top:.55rem;border-top:1px solid var(--border-light);font-size:.92rem;color:var(--text-dark)}
.word-popup .word-example{margin-top:.4rem;font-size:.78rem;color:var(--text-mid);font-style:italic;direction:ltr;font-family:var(--font-en)}
.word-popup .word-actions{margin-top:.7rem;display:flex;gap:.4rem}
.word-popup .word-btn{flex:1;padding:.4rem;font-size:.7rem;border:1px solid var(--border);background:#fff;border-radius:6px;cursor:pointer;color:var(--text-mid);font-family:var(--font-fa);transition:all .2s}
.word-popup .word-btn:hover{border-color:var(--primary-pale);color:var(--primary)}
.word-popup .word-btn.added{background:var(--success-bg);border-color:#B5D88A;color:var(--success)}

.practice-section{margin-bottom:1.5rem}
.practice-section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;padding:.85rem 1rem;background:var(--accent-light);border-radius:var(--radius);direction:ltr}
.practice-section-head h3{font-family:var(--font-display);font-size:1.1rem;color:var(--primary);font-weight:600;direction:ltr;text-align:left}
.practice-section-head .practice-fa{font-size:.82rem;color:var(--text-mid);font-weight:500;font-family:var(--font-fa);direction:rtl}
.practice-pairs{display:flex;flex-direction:column;gap:.85rem}
.practice-pair{display:flex;flex-direction:column;gap:.5rem;padding:.6rem;background:#fff;border:1px solid var(--border-light);border-radius:var(--radius)}
.practice-row{display:grid;grid-template-columns:1fr auto 1fr;gap:.85rem;align-items:center;direction:ltr}
.practice-side{padding:.85rem 1rem;border-radius:var(--radius);font-family:var(--font-en);direction:ltr;font-size:.9rem;line-height:1.5;border:1px solid;text-align:left}
.practice-q{background:var(--accent-light);border-color:#F4D89B;color:var(--text-dark)}
.practice-a{background:var(--primary-ghost);border-color:var(--primary-pale);color:var(--text-dark)}
.practice-arrow{width:32px;height:32px;border-radius:50%;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;color:var(--text-soft);flex-shrink:0;font-family:var(--font-en)}
.practice-trans-row{display:none;flex-direction:column;gap:.4rem}
.practice-trans-row.show{display:flex;animation:fadeInUp .25s}
.practice-trans-line{display:grid;grid-template-columns:1fr auto 1fr;gap:.85rem;align-items:center;direction:ltr}
.practice-trans-cell{direction:rtl;text-align:right;font-size:.78rem;color:var(--text-mid)}
.practice-trans-cell{font-size:.78rem;color:var(--text-mid);padding:.4rem .7rem;background:var(--bg-soft);border-radius:6px;text-align:right;line-height:1.5}
.practice-trans-arrow{width:32px;height:32px;flex-shrink:0}

.vocab-mode-tabs{display:flex;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap}
.vocab-mode-btn{padding:.55rem 1.1rem;background:#fff;border:1px solid var(--border);border-radius:100px;cursor:pointer;font-family:var(--font-fa);font-size:.82rem;color:var(--text-mid);transition:all .2s;display:flex;align-items:center;gap:.4rem}
.vocab-mode-btn:hover{border-color:var(--primary-pale);color:var(--primary)}
.vocab-mode-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.85rem}
.vocab-card{background:#fff;border:1px solid var(--border-light);border-radius:var(--radius);padding:1.15rem 1.15rem 1rem;transition:all .2s;position:relative}
.vocab-card.is-difficult{border-color:#F4D89B;background:linear-gradient(180deg,#FFFBF0 0%,#fff 100%)}
.vocab-word{font-family:var(--font-en);font-size:1.3rem;font-weight:700;color:var(--primary);direction:ltr;margin-bottom:.15rem;text-align:left}
.vocab-pos{display:inline-block;font-size:.62rem;color:var(--text-soft);background:var(--bg-soft);padding:2px 7px;border-radius:99px;margin-right:.4rem;font-family:var(--font-en);text-transform:uppercase;letter-spacing:.05em}
.vocab-ipa{font-family:var(--font-en);font-size:.78rem;color:var(--text-mid);direction:ltr;margin-bottom:.45rem;text-align:left}
.vocab-fa{font-size:.92rem;color:var(--text-dark);font-weight:500;margin-bottom:.45rem;text-align:right}
.vocab-example{font-size:.74rem;color:var(--text-soft);font-style:italic;direction:ltr;font-family:var(--font-en);line-height:1.5;text-align:left}
.vocab-card-actions{display:flex;gap:.4rem;margin-top:.85rem;padding-top:.75rem;border-top:1px dashed var(--border-light)}
.vocab-action-btn{flex:1;padding:.45rem .55rem;background:var(--bg-soft);border:1px solid var(--border-light);border-radius:6px;cursor:pointer;font-family:var(--font-fa);font-size:.72rem;color:var(--text-mid);transition:all .2s;display:flex;align-items:center;justify-content:center;gap:.3rem}
.vocab-action-btn:hover{border-color:var(--primary-pale);color:var(--primary);background:#fff}
.vocab-action-btn.play{flex:0 0 auto;width:auto;padding:.45rem .8rem}
.vocab-action-btn.difficulty.marked{background:#FFF7E0;border-color:#F4D89B;color:#8B5C0F}

/* ─── VOCAB MODES (flashcard/matching/fillblank) ─── */
.vocab-progress-bar{margin-bottom:1.5rem}
.vocab-progress-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;font-size:.82rem;color:var(--text-mid);font-family:var(--font-en);direction:ltr;gap:1rem}
.vocab-progress-info span:first-child{margin-left:auto;font-weight:600;color:var(--text-dark)}
.vocab-progress-track{height:5px;background:var(--border-light);border-radius:99px;overflow:hidden}
.vocab-progress-fill{height:100%;background:linear-gradient(90deg,var(--primary) 0%,var(--accent) 100%);border-radius:99px;transition:width .3s}

.vocab-btn{
  padding:.7rem 1.5rem;border:1px solid var(--border-light);border-radius:8px;
  cursor:pointer;font-family:var(--font-fa);font-size:.88rem;background:#fff;
  color:var(--text-dark);transition:all .2s;font-weight:500;
}
.vocab-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.vocab-btn.knew{border-color:var(--success);color:var(--success);background:var(--success-bg)}
.vocab-btn.knew:hover{background:var(--success);color:#fff}
.vocab-btn.didnt-know{border-color:var(--danger);color:var(--danger);background:var(--danger-bg)}
.vocab-btn.didnt-know:hover{background:var(--danger);color:#fff}

.vocab-result{text-align:center;padding:2rem 1rem;background:linear-gradient(135deg,var(--primary-ghost) 0%,#fff 100%);border-radius:var(--radius-lg);border:1px solid var(--primary-pale)}
.vocab-result-icon{font-size:4rem;margin-bottom:.85rem}
.vocab-result h3{font-size:1.4rem;color:var(--text-dark);margin-bottom:.5rem}
.vocab-result-stats{display:grid;grid-template-columns:1fr 1fr;gap:1rem;max-width:340px;margin:1.25rem auto;background:#fff;border:1px solid var(--border-light);border-radius:var(--radius);padding:1.25rem}
.vocab-result-stats .stat-num{font-family:var(--font-en);font-size:2rem;font-weight:700;line-height:1}
.vocab-result-stats .stat-num.knew{color:var(--success)}
.vocab-result-stats .stat-num.didnt-know{color:var(--danger)}
.vocab-result-stats .stat-label{font-size:.78rem;color:var(--text-mid);margin-top:.3rem}

/* ─── FLASHCARD MODE ─── */
.big-flashcard{
  max-width:480px;margin:0 auto;min-height:280px;
  background:linear-gradient(135deg,var(--primary-ghost) 0%,#fff 100%);
  border:2px solid var(--primary-pale);border-radius:var(--radius-lg);
  padding:2.5rem 2rem;cursor:pointer;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  transition:all .3s;position:relative;text-align:center;
}
.big-flashcard:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.big-flashcard.is-difficult{border-color:#F4D89B;background:linear-gradient(135deg,#FFF7E0 0%,#fff 100%)}
.big-flashcard .bf-back{display:none}
.big-flashcard.flipped .bf-front{display:none}
.big-flashcard.flipped .bf-back{display:block;animation:fadeInUp .3s}
.bf-word{font-family:var(--font-en);font-size:2.4rem;font-weight:700;color:var(--primary);direction:ltr;margin-bottom:.5rem;line-height:1.1}
.bf-pos{display:inline-block;font-size:.7rem;color:var(--text-soft);background:#fff;padding:3px 10px;border-radius:99px;margin-bottom:.85rem;font-family:var(--font-en);text-transform:uppercase}
.bf-ipa{font-family:var(--font-en);font-size:1.05rem;color:var(--text-mid);direction:ltr;margin-bottom:1rem}
.bf-tap-hint{font-size:.8rem;color:var(--text-soft);font-style:italic}
.bf-meaning{font-family:var(--font-fa);font-size:1.85rem;font-weight:600;color:var(--text-dark);margin-bottom:.85rem}
.bf-example{font-family:var(--font-en);direction:ltr;font-size:.92rem;color:var(--text-mid);font-style:italic;margin-bottom:1rem;padding:.75rem 1rem;background:var(--bg-soft);border-radius:8px}
.flashcard-actions{display:none;justify-content:center;gap:.85rem;margin-top:1.5rem}

/* ─── MATCHING MODE ─── */
.matching-info{margin-bottom:1.25rem}
.matching-progress{font-size:.85rem;color:var(--text-dark);font-weight:600;display:flex;align-items:center}
.matching-board{display:grid;grid-template-columns:1fr 1fr;gap:1rem;max-width:680px;margin:0 auto}
.matching-column{display:flex;flex-direction:column;gap:.5rem}
.matching-col-head{
  padding:.5rem 1rem;background:var(--bg-soft);border-radius:8px;
  text-align:center;font-weight:600;font-size:.85rem;color:var(--text-mid);
  font-family:var(--font-en);direction:ltr;margin-bottom:.25rem;
}
.matching-cell{
  padding:.85rem 1rem;border:1.5px solid var(--border-light);border-radius:var(--radius);
  background:#fff;cursor:pointer;transition:all .15s;text-align:center;min-height:50px;
  display:flex;align-items:center;justify-content:center;
}
.matching-cell.english{font-family:var(--font-en);direction:ltr;color:var(--text-dark);font-weight:500}
.matching-cell.persian{color:var(--text-dark)}
.matching-cell:hover:not(.matched):not(.selected){border-color:var(--primary-pale);background:var(--primary-ghost)}
.matching-cell.selected{border-color:var(--primary);background:var(--primary-ghost);transform:scale(1.02)}
.matching-cell.matched{border-color:var(--success);background:var(--success-bg);opacity:.6;cursor:default;pointer-events:none}
.matching-cell.matched .matching-cell-text{text-decoration:line-through;color:var(--text-soft)}
.matching-cell.wrong{border-color:var(--danger);background:var(--danger-bg);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ─── FILL-IN-BLANK MODE ─── */
.fillblank-card{
  max-width:600px;margin:0 auto;background:#fff;
  border:1px solid var(--border-light);border-radius:var(--radius-lg);
  padding:2rem;
}
.fb-meaning-section{
  background:var(--primary-ghost);border:1px solid var(--primary-pale);
  border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:1.5rem;text-align:center;
}
.fb-meaning-label{font-size:.78rem;color:var(--text-soft);margin-bottom:.4rem}
.fb-meaning-fa{font-size:1.4rem;font-weight:600;color:var(--text-dark);margin-bottom:.3rem}
.fb-meaning-pos{font-family:var(--font-en);direction:ltr;font-size:.8rem;color:var(--text-mid)}
.fb-sentence{
  font-family:var(--font-en);direction:ltr;font-size:1.15rem;line-height:1.8;
  text-align:center;padding:1.5rem 1rem;background:var(--bg-soft);
  border-radius:var(--radius);margin-bottom:1.25rem;color:var(--text-dark);
}
.fb-blank{
  display:inline-block;border-bottom:2px solid var(--accent);
  padding:0 .85rem;color:transparent;min-width:80px;
  background:var(--accent-light);border-radius:4px 4px 0 0;
}
.fb-blank.revealed{color:var(--success);font-weight:700;background:var(--success-bg);border-color:var(--success)}
.fb-blank.revealed.wrong{color:var(--danger);background:var(--danger-bg);border-color:var(--danger)}
.fb-input-row{display:flex;gap:.5rem;margin-bottom:1rem}
.fb-input{
  flex:1;padding:.85rem 1rem;border:1.5px solid var(--border-light);
  border-radius:var(--radius);font-family:var(--font-en);direction:ltr;
  font-size:1rem;background:#fff;text-align:center;
}
.fb-input:focus{outline:none;border-color:var(--primary);background:var(--primary-ghost)}
.fb-input:disabled{background:var(--bg-soft);cursor:not-allowed}
.fb-hint-display{
  text-align:center;padding:.6rem .85rem;background:var(--accent-light);
  border-radius:var(--radius);font-size:.85rem;color:#8B5C0F;margin-bottom:.85rem;
}
.fb-hint-display strong{font-family:var(--font-en);direction:ltr;font-size:1.05rem;letter-spacing:.1em}
.fb-actions{display:flex;gap:.5rem;justify-content:center;margin-top:.5rem}
.fb-action-btn{
  padding:.5rem 1rem;background:var(--bg-soft);border:1px solid var(--border-light);
  border-radius:8px;cursor:pointer;font-family:var(--font-fa);font-size:.78rem;color:var(--text-mid);
}
.fb-action-btn:hover:not(:disabled){border-color:var(--primary-pale);color:var(--primary);background:#fff}
.fb-action-btn:disabled{opacity:.4;cursor:not-allowed}
.fb-feedback{margin-top:1rem;text-align:center}
.fb-feedback-msg{padding:.7rem 1rem;border-radius:var(--radius);font-size:.92rem;font-weight:500;animation:fadeInUp .3s}
.fb-feedback-msg.correct{background:var(--success-bg);color:var(--success);border:1px solid #B5D88A}
.fb-feedback-msg.wrong{background:var(--danger-bg);color:var(--danger);border:1px solid #E8B0B0}
.fb-feedback-msg.warn{background:var(--accent-light);color:#8B5C0F;border:1px solid #F4D89B}
.fb-feedback-msg strong{font-family:var(--font-en);direction:ltr}

/* ═══════════════════════════════════════════════
   REVIEW PAGE STYLES
   ═══════════════════════════════════════════════ */
.review-summary{
  background:linear-gradient(135deg,var(--primary-ghost) 0%,#fff 100%);
  border:1px solid var(--primary-pale);border-radius:var(--radius-lg);
  padding:1.5rem;margin-bottom:2rem;
}
.review-summary-head h3{font-size:1.1rem;color:var(--text-dark);margin-bottom:.5rem;font-weight:700}
.review-summary-head p{font-size:.92rem;color:var(--text-mid);line-height:1.7;margin-bottom:1.25rem}

.review-lessons-mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.85rem;margin-bottom:1.5rem}
.review-lesson-mini{
  display:flex;align-items:center;gap:.85rem;padding:.85rem 1rem;
  background:#fff;border:1px solid var(--border-light);border-radius:var(--radius);
  cursor:pointer;transition:all .2s;text-decoration:none;color:inherit;
}
.review-lesson-mini:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.review-lesson-mini-num{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:1.2rem;font-weight:700;color:var(--text-dark);flex-shrink:0;
}
.review-lesson-mini-info{flex:1;min-width:0}
.review-lesson-mini-title{font-family:var(--font-display);font-size:.95rem;font-weight:700;color:var(--text-dark);direction:ltr;text-align:left;line-height:1.2}
.review-lesson-mini-fa{font-size:.78rem;color:var(--text-mid);margin-top:.15rem}
.review-lesson-mini-letters{font-family:var(--font-en);direction:ltr;font-size:.7rem;color:var(--primary);margin-top:.2rem}
.review-lesson-mini-arrow{color:var(--primary);font-size:1.1rem}

.review-summary-items{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.75rem}
.review-summary-item{
  display:flex;gap:.75rem;align-items:flex-start;
  padding:.85rem;background:#fff;border:1px solid var(--border-light);border-radius:var(--radius);
}
.review-summary-icon{font-size:1.4rem;flex-shrink:0}
.review-summary-title{font-weight:600;color:var(--text-dark);font-size:.88rem;margin-bottom:.2rem}
.review-summary-desc{font-size:.78rem;color:var(--text-soft);line-height:1.5}

.review-sections{display:flex;flex-direction:column;gap:1.25rem}
.review-section{
  border-radius:var(--radius-lg);overflow:hidden;
  border:1px solid;
}
.review-section-head{
  padding:.85rem 1.25rem;
  border-bottom:1px solid rgba(0,0,0,0.08);
}
.review-section-head h3{
  font-family:var(--font-display);font-size:1.15rem;font-weight:700;
  color:var(--text-dark);direction:ltr;text-align:left;line-height:1.2;
}
.review-section-fa{font-size:.85rem;color:var(--text-dark);opacity:.75;margin-top:.15rem}
.review-section-body{padding:1.25rem;display:flex;flex-direction:column;gap:1.25rem}

.check-if-item{
  background:#fff;border:1px solid var(--border-light);border-radius:var(--radius);
  padding:1.15rem 1.25rem;
}
.check-if-ask{
  font-family:var(--font-en);direction:ltr;font-size:.95rem;color:var(--text-dark);
  display:flex;align-items:flex-start;gap:.65rem;margin-bottom:.4rem;line-height:1.5;
}
.check-if-label{
  background:#3498DB;color:#fff;padding:.2rem .65rem;border-radius:99px;
  font-size:.7rem;font-weight:600;flex-shrink:0;letter-spacing:.05em;
  font-family:var(--font-en);direction:ltr;
}
.check-if-ask-fa{font-size:.82rem;color:var(--text-mid);margin-bottom:.85rem;line-height:1.6}

.check-if-template{
  font-family:var(--font-en);direction:ltr;font-size:.95rem;
  padding:.85rem 1rem;background:var(--bg-soft);border-radius:var(--radius);
  line-height:2;color:var(--text-dark);
}
.check-if-input{
  padding:.4rem .65rem;border:1px solid var(--border-light);border-radius:6px;
  font-family:var(--font-en);direction:ltr;font-size:.92rem;
  background:#fff;text-align:left;
  width:100%;box-sizing:border-box;min-width:0;max-width:100%;
}
.check-if-input:focus{outline:none;border-color:var(--primary);background:var(--primary-ghost)}
.check-if-input-inline{
  display:inline-block;width:auto;min-width:130px;max-width:200px;margin:0 .25rem;
  border:none;border-bottom:2px solid var(--accent);border-radius:0;
  background:transparent;padding:.15rem .5rem;font-weight:500;
}
.check-if-input-inline:focus{background:var(--accent-light);border-bottom-color:var(--primary)}

/* Letters table */
.letters-table{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.65rem}
.letters-table-row{
  display:flex;align-items:center;gap:.75rem;padding:.5rem .85rem;
  background:var(--primary-ghost);border-radius:var(--radius);
  min-width:0;
}
.letters-table-letter{
  font-family:var(--font-display);font-size:1.5rem;font-weight:700;
  color:var(--primary);width:36px;text-align:center;direction:ltr;flex-shrink:0;
}
.letters-input{
  flex:1;min-width:0;width:100%;
  padding:.45rem .6rem;font-size:.85rem;box-sizing:border-box;
}

/* Grade 8: Cluster letters (smaller, since they're 2-3 chars) */
.cluster-letter{
  font-size:1.2rem !important;width:auto !important;min-width:42px;
  letter-spacing:0.05em;
}

/* Grade 8: Review list (rows of empty inputs) */
.review-list{display:flex;flex-direction:column;gap:.5rem}
.review-list-row{
  display:flex;align-items:center;gap:.65rem;padding:.5rem .85rem;
  background:var(--primary-ghost);border-radius:var(--radius);
}
.review-list-num{
  font-family:var(--font-en);font-weight:700;color:var(--primary);
  min-width:24px;font-size:.9rem;flex-shrink:0;
}
.review-list-row .check-if-input{flex:1;min-width:0}

/* Grade 8: Two-column pairs list (Country/Nationality, Place/Location) */
.pairs-list-table{
  display:flex;flex-direction:column;gap:.45rem;
  background:var(--primary-ghost);border-radius:var(--radius);padding:.65rem;
}
.pairs-list-header{
  display:grid;grid-template-columns:1fr 1fr;gap:.65rem;
  font-family:var(--font-en);direction:ltr;font-weight:700;
  color:var(--primary);font-size:.92rem;
  padding:.4rem .25rem;
  border-bottom:2px solid var(--primary-pale);
  text-align:center;
}
.pairs-list-row{
  display:grid;grid-template-columns:1fr 1fr;gap:.65rem;
}
.pairs-list-row .check-if-input{
  width:100%;padding:.45rem .6rem;font-size:.85rem;box-sizing:border-box;
}

/* G9 Review: Image words grid */
.image-words-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.85rem;
}
.image-word-card{
  background:var(--bg-soft);border-radius:var(--radius);padding:1rem;text-align:center;
  display:flex;flex-direction:column;gap:.5rem;align-items:center;
  border:1px solid var(--border-light);
}
.image-word-emoji{font-size:2.5rem;line-height:1}
.image-word-hint{font-size:.78rem;color:var(--text-mid);min-height:2.5em;display:flex;align-items:center;justify-content:center}
.image-word-card .check-if-input{width:100%;text-align:center;font-family:var(--font-en);direction:ltr}

/* G9 Review: Sentence transform */
.transform-list{display:flex;flex-direction:column;gap:1rem;direction:ltr}
.transform-block{
  background:var(--primary-ghost);border-radius:var(--radius);padding:.85rem 1rem;
  border-right:3px solid var(--primary);
}
.transform-original{
  display:flex;gap:.5rem;margin-bottom:.65rem;align-items:flex-start;
  font-family:var(--font-en);direction:ltr;
}
.transform-original-num{
  font-weight:700;color:var(--primary);flex-shrink:0;
}
.transform-original-text{font-weight:600;color:var(--text-dark)}
.transform-row{
  display:grid;grid-template-columns:120px 1fr;gap:.6rem;align-items:center;margin-bottom:.4rem;
}
.transform-label{
  font-family:var(--font-en);direction:ltr;font-size:.82rem;color:var(--accent);
  font-weight:600;text-align:left;
}
.transform-input{padding:.4rem .65rem;font-size:.85rem}

/* G9 Review: Fill sentences */
.fill-sentences-list{display:flex;flex-direction:column;gap:.65rem;direction:ltr}
.fill-sentence-row{
  display:flex;gap:.5rem;align-items:center;
  background:var(--bg-soft);border-radius:8px;padding:.5rem .75rem;
  font-family:var(--font-en);direction:ltr;
}
.fill-sentence-num{font-weight:700;color:var(--primary);flex-shrink:0}
.fill-sentence-text{
  display:flex;align-items:center;gap:.3rem;flex:1;font-size:.9rem;flex-wrap:wrap;
}
.fill-sentence-input{
  width:90px;display:inline-block;padding:.3rem .5rem;font-size:.85rem;
  text-align:center;
}

/* G9 Review: Examples display (Language Melody) */
.examples-display-list{
  background:linear-gradient(135deg,var(--accent-light),#FFF4E0);
  border-radius:var(--radius);padding:1rem 1.25rem;
  display:flex;flex-direction:column;gap:.5rem;direction:ltr;
}
.example-display-row{
  display:flex;gap:.5rem;align-items:center;
  font-family:var(--font-en);direction:ltr;
}
.example-display-num{
  font-weight:700;color:var(--accent);flex-shrink:0;
}
.example-display-text{font-size:.95rem;color:var(--text-dark);font-weight:600}

/* Family jobs */
.family-jobs-table{display:flex;flex-direction:column;gap:.5rem}
.family-jobs-row{
  display:grid;grid-template-columns:160px 1fr;gap:.85rem;align-items:center;
  padding:.6rem .85rem;background:var(--bg-soft);border-radius:var(--radius);
}
.family-jobs-label{
  font-family:var(--font-en);direction:ltr;font-size:.85rem;
  color:var(--text-dark);font-weight:500;text-align:left;
}
.family-jobs-label-fa{font-family:var(--font-fa);direction:rtl;text-align:right;font-size:.72rem;color:var(--text-soft);font-weight:400;margin-top:1px}

/* Self-check (yes/no) */
.self-check-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:.85rem 1rem;background:var(--bg-soft);border-radius:var(--radius);
  flex-wrap:wrap;gap:.5rem;
}
.self-check-label{display:flex;align-items:center;gap:.65rem;cursor:pointer;flex:1}
.self-check-label input{width:18px;height:18px;cursor:pointer;accent-color:var(--success);flex-shrink:0}
.self-check-label span{font-size:.88rem;color:var(--text-dark)}
.self-check-link{
  font-size:.78rem;color:var(--primary);background:#fff;
  padding:.4rem .85rem;border-radius:6px;text-decoration:none;
  border:1px solid var(--primary-pale);
}
.self-check-link:hover{background:var(--primary);color:#fff}

/* Four rooms */
.four-rooms-grid{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
.four-rooms-grid input{padding:.5rem .75rem;font-size:.88rem;width:100%;box-sizing:border-box;min-width:0}

.review-actions{
  display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;
  margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--border-light);
}

/* ═══════════════════════════════════════════════
   GRADE 8 SPECIFIC STYLES
   ═══════════════════════════════════════════════ */

/* SPELLING & PRONUNCIATION */
.spelling-sample{
  background:linear-gradient(180deg,var(--accent-light) 0%,#fff 100%);
  border:1px solid #F4D89B;border-radius:var(--radius-lg);padding:1.25rem 1.5rem;
  margin-bottom:1.5rem;
}
.spelling-line{
  padding:.45rem 0;font-size:.92rem;direction:ltr;text-align:left;
  border-bottom:1px dashed var(--border-light);
}
.spelling-line:last-child{border-bottom:none}
.spelling-line strong{margin-left:.5rem}

.clusters-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.5rem}
.cluster-card{
  background:#fff;border:1px solid var(--border-light);border-radius:var(--radius-lg);
  padding:1.25rem;text-align:center;transition:all .25s;
}
.cluster-card:hover{border-color:var(--primary-pale);box-shadow:var(--shadow);transform:translateY(-3px)}
.cluster-display{
  font-family:var(--font-display);font-size:3rem;line-height:1;
  margin-bottom:.5rem;direction:ltr;font-weight:700;
}
.cluster-display.color-1{color:var(--primary)}
.cluster-display.color-2{color:var(--accent)}
.cluster-display.color-3{color:var(--success-soft)}
.cluster-display.color-4{color:#9B59B6}
.cluster-fa{font-size:.82rem;color:var(--text-mid);margin-bottom:.85rem;padding-bottom:.85rem;border-bottom:1px dashed var(--border-light)}
.cluster-examples{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center}
.cluster-ex{
  font-family:var(--font-en);direction:ltr;font-size:.78rem;color:var(--primary);
  background:var(--primary-ghost);padding:.25rem .65rem;border-radius:99px;font-weight:500;
}

.crossword-card{
  background:linear-gradient(135deg,var(--primary-ghost) 0%,#fff 100%);
  border:1px solid var(--primary-pale);border-radius:var(--radius-lg);padding:1.5rem;
}
.crossword-card h4{font-size:1.05rem;color:var(--primary);margin-bottom:.5rem;font-weight:600}
.crossword-clues{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-top:1rem}
.clues-section h5{
  font-family:var(--font-en);direction:ltr;text-align:left;
  font-size:1rem;color:var(--text-dark);margin-bottom:.65rem;font-weight:600;
}
.clues-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.4rem}
.clues-list li{
  padding:.5rem .85rem;background:#fff;border:1px solid var(--border-light);
  border-radius:var(--radius);font-size:.85rem;font-family:var(--font-en);direction:ltr;
}
.clue-num{font-weight:700;color:var(--primary);margin-left:.4rem}
.clue-answer{
  display:inline-block;font-family:var(--font-en);direction:ltr;
  background:var(--success-bg);color:var(--success);padding:1px 8px;
  border-radius:4px;font-size:.78rem;font-weight:600;margin-right:.4rem;
}

/* PAIR WORK & ROLE PLAY */
.pair-cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:.85rem}
.pair-card{
  background:linear-gradient(135deg,var(--primary-ghost) 0%,#fff 100%);
  border:2px solid var(--primary-pale);border-radius:var(--radius-lg);padding:1.25rem;
}
.pair-card-role{
  display:inline-block;background:var(--primary);color:#fff;padding:.25rem .85rem;
  border-radius:99px;font-size:.78rem;font-weight:600;margin-bottom:.65rem;
  font-family:var(--font-en);direction:ltr;
}
.pair-card-task{font-size:.85rem;color:var(--text-mid);margin-bottom:1rem;line-height:1.6}
.pair-card-fields{display:flex;flex-direction:column;gap:.55rem}
.pair-card-field{display:flex;align-items:center;gap:.5rem;direction:ltr}
.pair-card-field label{
  font-family:var(--font-en);direction:ltr;font-size:.82rem;
  color:var(--text-mid);min-width:90px;text-align:left;flex-shrink:0;
}
.pair-card-field input{flex:1;min-width:0}

.role-play-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.85rem;margin-top:.85rem}
.role-card{
  background:#fff;border:1px solid var(--border-light);border-radius:var(--radius);
  padding:1rem 1.15rem;display:flex;align-items:flex-start;gap:.85rem;transition:all .2s;
}
.role-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.role-card.role-1{border-left:4px solid var(--primary)}
.role-card.role-2{border-left:4px solid var(--accent)}
.role-card.role-3{border-left:4px solid var(--success-soft)}
.role-card-num{
  width:28px;height:28px;border-radius:50%;background:var(--bg-soft);
  display:flex;align-items:center;justify-content:center;font-weight:700;
  font-family:var(--font-en);font-size:.92rem;flex-shrink:0;color:var(--primary);
}
.role-card-name{
  font-family:var(--font-en);direction:ltr;text-align:left;
  font-weight:600;color:var(--primary);margin-bottom:.3rem;
}
.role-card-task{font-size:.82rem;color:var(--text-mid);line-height:1.6}

/* WORKBOOK GRADE 8 */
.map-task-info{
  background:var(--accent-light);border:1px solid #F4D89B;border-radius:var(--radius);
  padding:.75rem 1rem;margin-bottom:1rem;font-size:.85rem;color:#8B5C0F;
}
.country-numbers-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.65rem}
.country-number-card{
  display:flex;align-items:center;gap:.85rem;
  background:linear-gradient(135deg,var(--primary-ghost) 0%,#fff 100%);
  border:1px solid var(--primary-pale);border-radius:var(--radius);padding:.65rem .85rem;
}
.country-num{
  width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;
  font-family:var(--font-en);font-size:1rem;flex-shrink:0;
}
.country-name{font-family:var(--font-en);direction:ltr;font-weight:600;color:var(--text-dark)}
.country-fa{font-size:.78rem;color:var(--text-mid);margin-top:.1rem}

.city-cloud{display:flex;flex-wrap:wrap;gap:.4rem;padding:1rem;background:var(--bg-soft);border-radius:var(--radius);margin-bottom:.85rem}
.city-chip{
  display:inline-block;padding:.4rem .85rem;background:#fff;
  border:1px solid var(--border-light);border-radius:99px;cursor:pointer;
  font-family:var(--font-en);direction:ltr;font-size:.82rem;color:var(--text-dark);
  transition:all .2s;
}
.city-chip:hover{border-color:var(--primary-pale);background:var(--primary-ghost)}
.city-chip.selected{background:var(--accent);color:#fff;border-color:var(--accent)}
.city-chip.city-correct{background:var(--success);color:#fff;border-color:var(--success)}
.city-chip.city-incorrect.selected{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}

.route-farsi{
  background:var(--bg-soft);border-right:3px solid var(--primary);border-radius:var(--radius);
  padding:.85rem 1rem;margin-bottom:1rem;font-size:.92rem;line-height:1.7;
}
.route-steps{
  display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;
  padding:1rem;background:linear-gradient(135deg,var(--primary-ghost),#fff);
  border-radius:var(--radius);direction:ltr;
}
.route-step{display:flex;align-items:center;gap:.5rem}
.route-step-given{
  font-family:var(--font-en);direction:ltr;font-weight:700;color:var(--success);
  background:var(--success-bg);padding:.45rem .85rem;border-radius:8px;
}
.route-step input{width:130px}
.route-arrow{color:var(--primary);font-weight:700;font-size:1.2rem}

.image-country-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.85rem}
.image-country-card{
  background:linear-gradient(135deg,var(--primary-ghost),#fff);
  border:1px solid var(--primary-pale);border-radius:var(--radius);
  padding:1rem;text-align:center;
}
.image-country-emoji{font-size:3rem;margin-bottom:.4rem;line-height:1}
.image-country-hint{font-size:.78rem;color:var(--text-mid);margin-bottom:.65rem}

.famous-people-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.85rem}
.famous-person-card{
  background:#fff;border:1px solid var(--border-light);border-radius:var(--radius);
  padding:1rem;text-align:center;
}
.famous-person-photo{
  width:60px;height:60px;border-radius:50%;background:var(--bg-soft);
  display:flex;align-items:center;justify-content:center;font-size:2rem;
  margin:0 auto .5rem;
}
.famous-person-name{
  font-family:var(--font-en);direction:ltr;font-weight:600;color:var(--text-dark);
  margin-bottom:.5rem;font-size:.92rem;
}

/* G8 L2-L7 specific styles */
/* ═══════════════════════════════════════
   G9 GRAMMAR EXPLANATION & TIPS
   ═══════════════════════════════════════ */
.grammar-explanation{
  display:flex;gap:.85rem;align-items:flex-start;
  background:linear-gradient(135deg,#FFF8DC,#FFFAE6);
  border:1px solid #F4D89B;border-radius:var(--radius);
  padding:1rem 1.25rem;margin-bottom:1.25rem;
  direction:rtl;
}
.grammar-explanation-icon{
  font-size:1.5rem;flex-shrink:0;
}
.grammar-explanation-content{flex:1;direction:rtl;text-align:right}
.grammar-explanation-content h4{
  font-family:var(--font-fa);font-size:.95rem;color:#8B5C0F;
  margin-bottom:.5rem;font-weight:700;text-align:right;
}
.grammar-explanation-content p{
  font-size:.85rem;line-height:2;color:var(--text-dark);
  margin-bottom:.5rem;text-align:right;direction:rtl;
}
.grammar-explanation-content p:last-child{margin-bottom:0}
.grammar-explanation-content code,
.grammar-tip code,
.practice-explanation code{
  display:inline-block;direction:ltr;unicode-bidi:isolate;
  background:#fff;padding:.1rem .4rem;border-radius:4px;
  font-family:var(--font-en);font-size:.88em;
  border:1px solid var(--border-light);
  vertical-align:middle;margin:0 .15rem;
  color:var(--primary);font-weight:600;
}
/* Code with nested strong (for emphasized English words) */
.grammar-explanation-content code strong,
.grammar-tip code strong,
.practice-explanation code strong{font-weight:700}
/* Plain strong with English content - isolate from RTL context */
.grammar-explanation-content strong,
.grammar-tip strong,
.practice-explanation strong{
  unicode-bidi:isolate;
  color:var(--primary);
  font-weight:700;
}
.practice-explanation strong{color:#8B5C0F !important}

.grammar-tip{
  background:var(--primary-ghost);
  border-right:4px solid var(--primary);
  border-radius:8px;padding:.85rem 1rem;
  margin-top:1rem;font-size:.85rem;line-height:2;
  color:var(--text-dark);
  direction:rtl;text-align:right;
}

/* PRACTICE EXPLANATION */
.practice-explanation{
  background:var(--accent-light);
  border-right:3px solid var(--accent);
  border-radius:8px;padding:.7rem .9rem;
  margin-top:.6rem;font-size:.82rem;line-height:2;
  color:#8B5C0F;
  direction:rtl;text-align:right;
}

/* ═══════════════════════════════════════
   G9 LANGUAGE MELODY 
   ═══════════════════════════════════════ */
.melody-examples{
  display:flex;flex-direction:column;gap:.6rem;
  background:linear-gradient(135deg,var(--primary-ghost),#fff);
  border:1px solid var(--primary-pale);border-radius:var(--radius);padding:1rem;
}
.melody-example-row{
  display:flex;align-items:center;gap:.85rem;padding:.65rem .85rem;
  background:#fff;border-radius:8px;border:1px solid var(--border-light);
  font-family:var(--font-en);direction:ltr;
}
.melody-num{
  display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:50%;background:var(--primary);
  color:#fff;font-weight:700;font-family:var(--font-en);font-size:.85rem;flex-shrink:0;
}
.melody-text{flex:1;font-size:.95rem;color:var(--text-dark)}
.melody-arrow{
  font-size:1.4rem;color:var(--accent);font-weight:700;
  cursor:help;flex-shrink:0;
}

.talk-to-teacher{
  background:linear-gradient(135deg,#FFF4E0,#FFEAC9);
  border:2px solid #F4D89B;border-radius:var(--radius);
  padding:1rem 1.25rem;margin-top:1.25rem;
}
.talk-to-teacher-label{
  font-family:var(--font-en);direction:ltr;color:#8B5C0F;
  font-weight:700;font-size:.95rem;margin-bottom:.5rem;
}
.talk-to-teacher-content{
  font-family:var(--font-en);direction:ltr;color:var(--text-dark);
  font-size:1rem;font-style:italic;
}

/* ═══════════════════════════════════════
   G9 GRAMMAR
   ═══════════════════════════════════════ */
.grammar-tables{display:flex;flex-direction:column;gap:1.25rem;margin-bottom:1.25rem}
.grammar-table-card{
  background:#fff;border:1px solid var(--border-light);border-radius:var(--radius);
  overflow:hidden;
}
.grammar-table-title{
  background:linear-gradient(135deg,var(--primary-ghost),#fff);
  padding:.85rem 1rem;font-family:var(--font-en);direction:ltr;
  color:var(--primary);font-weight:700;
  border-bottom:1px solid var(--primary-pale);
}
.grammar-table{
  width:100%;border-collapse:collapse;direction:ltr;font-family:var(--font-en);
}
.grammar-table th{
  background:var(--bg-soft);padding:.65rem .85rem;
  font-weight:600;color:var(--text-mid);font-size:.85rem;
  border-bottom:1px solid var(--border-light);text-align:left;
}
.grammar-table td{
  padding:.65rem .85rem;border-bottom:1px solid var(--border-light);
  font-size:.92rem;color:var(--text-dark);
}
.grammar-table tr:last-child td{border-bottom:none}

.grammar-examples{
  display:flex;flex-direction:column;gap:.5rem;
}
.grammar-example-row{
  background:var(--bg-soft);border-radius:8px;padding:.65rem .85rem;
  display:flex;align-items:center;gap:.6rem;
}
.grammar-example-row .grammar-example-content{flex:1;min-width:0}
.grammar-example-en{
  font-family:var(--font-en);direction:ltr;color:var(--text-dark);
  font-size:.92rem;font-weight:500;margin-bottom:.2rem;text-align:left;
}
.grammar-example-fa{font-size:.82rem;color:var(--text-mid);text-align:right;direction:rtl}
.grammar-table-examples{display:flex;flex-direction:column;gap:.5rem;margin-top:.85rem;padding:.85rem;background:#FFF8E7;border:1px dashed #F4D89B;border-radius:8px}
.grammar-table-examples .grammar-example-row{background:#fff}

.see-also-card{
  background:linear-gradient(135deg,#FFF8DC,#FAFAF0);
  border:2px dashed var(--accent);border-radius:var(--radius-lg);
  padding:1.25rem;margin-top:1.5rem;
}
.see-also-title{
  font-family:var(--font-display);font-size:1.15rem;
  color:var(--accent);margin-bottom:.25rem;
}
.see-also-fa{font-size:.85rem;color:var(--text-mid);margin-bottom:1rem}
.see-also-table{
  width:100%;border-collapse:collapse;direction:ltr;font-family:var(--font-en);
  background:#fff;border-radius:8px;overflow:hidden;
}
.see-also-table th{
  background:var(--accent-light);padding:.65rem;
  font-size:.85rem;color:#8B5C0F;font-weight:700;
}
.see-also-table td{
  padding:.5rem .65rem;border-top:1px solid var(--border-light);
  font-size:.88rem;
}
.see-also-other{
  list-style:none;padding:0;margin:0;
}
.see-also-other li{
  padding:.5rem .85rem;background:#fff;border-radius:6px;
  margin-bottom:.4rem;font-family:var(--font-en);direction:ltr;
  font-size:.88rem;
}

/* ═══════════════════════════════════════
   G9 LISTENING-READING-WRITING (LRW)
   ═══════════════════════════════════════ */
.lrw-section{
  background:#fff;border:1px solid var(--border-light);border-radius:var(--radius);
  padding:1.25rem;margin-bottom:1.25rem;
}
.lrw-section-head{margin-bottom:1rem}
.lrw-section-head h3{
  font-family:var(--font-display);font-size:1.05rem;color:var(--primary);
  margin-bottom:.4rem;
}
.lrw-section-desc{font-size:.85rem;color:var(--text-mid);line-height:1.6}

.lrw-find-it{
  background:var(--bg-soft);border-radius:8px;padding:1rem;
}
.lrw-example{
  background:#fff;border-left:3px solid var(--success);padding:.5rem .75rem;
  margin-bottom:.85rem;font-family:var(--font-en);direction:ltr;font-size:.88rem;
}
.lrw-passage{
  font-family:var(--font-en);direction:ltr;line-height:1.9;
  color:var(--text-dark);font-size:.92rem;background:#fff;
  padding:.85rem 1rem;border-radius:6px;
}
.lrw-targets{display:flex;flex-wrap:wrap;gap:.4rem}
.target-chip{
  background:var(--success-bg);color:var(--success);
  padding:.3rem .7rem;border-radius:99px;font-size:.82rem;
  font-family:var(--font-en);direction:ltr;border:1px solid var(--success);
}

.lrw-textarea-wrap{padding:.5rem 0}
.lrw-textarea{
  width:100%;font-family:var(--font-en);direction:ltr;
  padding:.85rem;border:1px solid var(--border-light);border-radius:8px;
  font-size:.95rem;line-height:1.6;resize:vertical;
}

.lrw-table{width:100%;border-collapse:collapse;margin-top:.85rem}
.lrw-table th{
  background:var(--primary-ghost);padding:.65rem;
  font-family:var(--font-en);direction:ltr;color:var(--primary);
  font-size:.88rem;border:1px solid var(--primary-pale);
}
.lrw-table td{
  padding:.4rem;border:1px solid var(--border-light);
}
.lrw-input{
  width:100%;padding:.4rem .55rem;border:1px solid transparent;
  background:transparent;font-family:var(--font-en);direction:ltr;
  font-size:.88rem;border-radius:4px;
}
.lrw-input:focus{outline:none;border-color:var(--primary);background:var(--bg-soft)}
.lrw-input-inline{
  display:inline-block;width:140px;padding:.25rem .5rem;
  border:none;border-bottom:2px solid var(--primary);
  background:transparent;font-family:var(--font-en);direction:ltr;
  font-size:.95rem;text-align:center;
}
.lrw-input-inline:focus{outline:none;border-bottom-color:var(--accent);background:var(--bg-soft)}

.lrw-questions{display:flex;flex-direction:column;gap:1rem;margin-top:.85rem}
.lrw-question-row{
  background:var(--bg-soft);border-radius:8px;padding:.85rem 1rem;
}
.lrw-q{
  font-family:var(--font-en);direction:ltr;color:var(--primary);
  font-size:.95rem;margin-bottom:.6rem;
}
.lrw-q-template{
  font-family:var(--font-en);direction:ltr;line-height:2;
  font-size:.92rem;color:var(--text-dark);
}

/* ═══════════════════════════════════════
   G9 CARD A/B
   ═══════════════════════════════════════ */
.card-pair-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:1rem;direction:ltr;
}
.card-ab{
  background:#fff;border:2px solid var(--primary-pale);border-radius:var(--radius);
  padding:1rem;
}
.card-a{background:linear-gradient(135deg,var(--primary-ghost),#fff)}
.card-b{background:linear-gradient(135deg,#FFF4E0,#fff);border-color:#F4D89B}
.card-ab-label{
  font-family:var(--font-en);direction:ltr;font-weight:700;
  color:var(--primary);font-size:.95rem;margin-bottom:.85rem;
  padding-bottom:.5rem;border-bottom:2px solid currentColor;
}
.card-b .card-ab-label{color:#8B5C0F}
.card-questions, .card-answers{
  list-style:none;padding:0;margin:0;
  display:flex;flex-direction:column;gap:.55rem;
}
.card-questions li, .card-answers li{
  font-family:var(--font-en);direction:ltr;font-size:.88rem;
  padding:.4rem 0;
}
.card-answers li{display:flex;align-items:center;gap:.4rem}
.card-answers li::before{
  content:counter(list-item) ".";counter-increment:list-item;
  color:#8B5C0F;font-weight:700;min-width:20px;
}
.card-answers{counter-reset:list-item}
.card-answers li input{flex:1;width:100%}
.card-questions{counter-reset:list-item-q}
.card-questions li{display:flex;align-items:flex-start;gap:.4rem}
.card-questions li::before{
  content:counter(list-item-q) ".";counter-increment:list-item-q;
  color:var(--primary);font-weight:700;min-width:20px;
}

@media (max-width:600px){
  .card-pair-grid{grid-template-columns:1fr}
}

/* ═══════════════════════════════════════
   G9 WORKBOOK TASKS
   ═══════════════════════════════════════ */
/* MULTIPLE-CHOICE-INLINE */
.mc-inline-list{display:flex;flex-direction:column;gap:.6rem}
.mc-inline-row{
  display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;
  background:var(--bg-soft);border-radius:8px;padding:.65rem .85rem;
  font-family:var(--font-en);direction:ltr;
}
.mc-inline-num{
  color:var(--primary);font-weight:700;flex-shrink:0;
}
.mc-inline-text{font-family:var(--font-en);direction:ltr;color:var(--text-dark);font-size:.92rem}
.mc-inline-options{
  display:inline-flex;align-items:center;gap:.25rem;
  background:#fff;border:1px solid var(--primary-pale);border-radius:6px;
  padding:.15rem;
}
.mc-inline-btn{
  background:transparent;border:none;cursor:pointer;
  padding:.35rem .75rem;border-radius:4px;
  font-family:var(--font-en);direction:ltr;font-size:.88rem;
  color:var(--text-mid);font-weight:500;transition:all .15s;
}
.mc-inline-btn:hover{background:var(--primary-ghost);color:var(--primary)}
.mc-inline-btn.selected{background:var(--primary);color:#fff}
.mc-inline-btn.correct{background:var(--success);color:#fff}
.mc-inline-btn.incorrect{background:#f87171;color:#fff}
.mc-inline-sep{color:var(--text-soft);font-weight:300}

/* UNSCRAMBLE-SENTENCES */
.unscramble-list{display:flex;flex-direction:column;gap:.65rem}
.unscramble-row{
  background:var(--bg-soft);border-radius:8px;padding:.85rem;
}
.unscramble-words{
  display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;margin-bottom:.65rem;
  direction:ltr;
}
.unscramble-num{
  color:var(--primary);font-weight:700;font-family:var(--font-en);margin-right:.25rem;
}
.word-chip{
  display:inline-block;padding:.3rem .7rem;background:#fff;
  border:1px solid var(--primary-pale);border-radius:99px;
  font-family:var(--font-en);direction:ltr;font-size:.85rem;
  color:var(--primary);font-weight:500;
}

/* MATCH-SENTENCE-IMAGE */
.msi-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.msi-sentences h5, .msi-images h5{
  font-family:var(--font-en);direction:ltr;color:var(--primary);
  font-size:.95rem;font-weight:700;margin-bottom:.65rem;
  padding-bottom:.4rem;border-bottom:2px solid var(--primary-pale);
}
.msi-sentence-row{
  display:flex;align-items:center;gap:.5rem;padding:.55rem .65rem;
  background:#fff;border:1px solid var(--border-light);border-radius:8px;
  margin-bottom:.4rem;direction:ltr;
}
.msi-num{color:var(--primary);font-weight:700;font-family:var(--font-en);flex-shrink:0;font-size:.8rem}
.msi-text{flex:1;font-family:var(--font-en);direction:ltr;font-size:.85rem;color:var(--text-dark)}

.msi-image-card{
  display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:.65rem;
  background:linear-gradient(135deg,var(--accent-light),#fff);
  border:1px solid #F4D89B;border-radius:8px;margin-bottom:.5rem;
  text-align:center;
}
.msi-image-card .img-box{margin:0;width:100%;max-width:140px}
.msi-image-letter{
  display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;border-radius:50%;background:var(--accent);
  color:#fff;font-weight:700;font-family:var(--font-en);font-size:.85rem;flex-shrink:0;
}
.msi-image-emoji{font-size:1.3rem}
.msi-image-hint{font-size:.78rem;color:var(--text-mid);line-height:1.4}

@media (max-width:600px){.msi-grid{grid-template-columns:1fr}}

/* WORD-SEARCH */
.word-search-grid{
  display:flex;flex-direction:column;gap:2px;
  background:var(--primary-pale);padding:2px;border-radius:8px;
  width:fit-content;margin:.85rem auto;
}
.ws-row{display:flex;gap:2px}
.ws-cell{
  display:inline-flex;align-items:center;justify-content:center;
  width:38px;height:38px;background:#fff;
  font-family:var(--font-en);direction:ltr;font-weight:700;font-size:1rem;
  color:var(--text-dark);cursor:pointer;border-radius:4px;
}
.ws-cell:hover{background:var(--primary-ghost);color:var(--primary)}
.ws-cell.found{background:var(--success);color:#fff}

.ws-target-words{
  background:var(--bg-soft);padding:.85rem;border-radius:8px;
  margin:.85rem 0;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;
}
.ws-target-words strong{font-size:.85rem;color:var(--text-dark)}
.ws-target-chip{
  display:inline-block;padding:.3rem .7rem;background:#fff;
  border:1px solid var(--primary-pale);border-radius:99px;
  font-family:var(--font-en);direction:ltr;font-size:.78rem;
  font-weight:600;color:var(--primary);
}

@media (max-width:600px){
  .ws-cell{width:32px;height:32px;font-size:.85rem}
}

/* FILL-WITH-IMAGE */
.fwi-list{display:flex;flex-direction:column;gap:.85rem}
.fwi-row{
  display:flex;align-items:center;gap:1rem;
  background:var(--bg-soft);border-radius:8px;padding:.85rem;
}
.fwi-image{
  display:flex;flex-direction:column;align-items:center;gap:.3rem;
  min-width:110px;flex-shrink:0;text-align:center;
}
.fwi-image .img-box{margin:0;width:100%;max-width:110px}
.fwi-emoji{font-size:2rem}
.fwi-hint{font-size:.72rem;color:var(--text-soft);line-height:1.3}
.fwi-sentence{
  flex:1;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;
  font-family:var(--font-en);direction:ltr;line-height:1.8;
}
.fwi-num{color:var(--primary);font-weight:700;flex-shrink:0}

@media (max-width:600px){
  .fwi-row{flex-direction:column;align-items:stretch}
  .fwi-image{min-width:0;flex-direction:row;justify-content:center;gap:.65rem}
}

.wb-example-box{
  background:linear-gradient(135deg,var(--success-bg),#fff);
  border:1px solid #B5D88A;border-radius:var(--radius);
  padding:.85rem 1rem;margin-bottom:1rem;font-family:var(--font-en);direction:ltr;
  font-size:.9rem;line-height:1.6;
}

.sentence-builder-list{display:flex;flex-direction:column;gap:.55rem}
.sentence-builder-row{
  display:flex;align-items:center;gap:.5rem;direction:ltr;
  padding:.5rem .85rem;background:var(--bg-soft);border-radius:8px;
}
.sb-num{font-weight:700;color:var(--primary);font-family:var(--font-en);min-width:24px}
.sb-prefix,.sb-suffix{font-family:var(--font-en);direction:ltr;color:var(--text-dark);font-size:.88rem}
.sentence-builder-row input{flex:1;min-width:80px}

.match-pairs-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.match-col h5{
  font-family:var(--font-en);direction:ltr;text-align:left;
  font-size:.95rem;color:var(--primary);margin-bottom:.55rem;font-weight:600;
}
.match-pair-row{
  display:flex;align-items:center;gap:.55rem;padding:.5rem .75rem;
  background:#fff;border:1px solid var(--border-light);border-radius:8px;margin-bottom:.4rem;
}
.match-letter,.match-num{
  display:inline-flex;align-items:center;justify-content:center;
  width:24px;height:24px;border-radius:50%;background:var(--primary-ghost);
  color:var(--primary);font-weight:700;font-family:var(--font-en);font-size:.78rem;flex-shrink:0;
}
.match-text{flex:1;font-size:.85rem;font-family:var(--font-en);direction:ltr}

.ability-grid{display:flex;flex-wrap:wrap;gap:.5rem;padding:1rem;background:var(--bg-soft);border-radius:var(--radius)}
.ability-chip{
  display:flex;align-items:center;gap:.4rem;padding:.45rem .85rem;
  background:#fff;border:1px solid var(--border-light);border-radius:99px;
  cursor:pointer;font-size:.82rem;font-family:var(--font-en);direction:ltr;
}
.ability-chip:hover{border-color:var(--primary-pale)}
.ability-chip input{accent-color:var(--primary)}

.fillblank-list{display:flex;flex-direction:column;gap:.65rem}
.fillblank-item{
  padding:.65rem .85rem;background:var(--bg-soft);border-radius:8px;
  font-family:var(--font-en);direction:ltr;font-size:.9rem;line-height:1.8;
}
.fillblank-item .wb-input{display:inline-block;width:140px;margin:0 .25rem}
.fb-num{color:var(--primary);font-weight:700;margin-left:.5rem}

.dialog-builder{
  background:linear-gradient(135deg,var(--primary-ghost),#fff);
  border:1px solid var(--primary-pale);border-radius:var(--radius);padding:1rem;
}
.dialog-line{
  display:flex;align-items:center;gap:.65rem;padding:.5rem 0;
  border-bottom:1px dashed var(--border-light);
}
.dialog-line:last-child{border-bottom:none}
.dialog-line .wb-input{flex:1;min-width:0}

.wb-prompt{
  background:var(--accent-light);border:1px solid #F4D89B;border-radius:8px;
  padding:.85rem 1rem;font-size:.85rem;color:#8B5C0F;line-height:1.6;
}

/* CLASSMATES-ABILITIES */
.classmates-abilities-list{display:flex;flex-direction:column;gap:.6rem}
.classmate-row{
  background:linear-gradient(135deg,var(--primary-ghost),#fff);
  border:1px solid var(--primary-pale);border-radius:var(--radius);padding:.75rem .85rem;
}
.classmate-q{
  display:flex;align-items:flex-start;gap:.5rem;margin-bottom:.5rem;
  font-family:var(--font-en);direction:ltr;font-size:.88rem;color:var(--text-dark);
}
.classmate-bullet{color:var(--primary);font-size:.8rem;margin-top:.2rem}

/* SEARCH-SUGGESTIONS (L4 ex 1) */
.search-suggestions-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.85rem;
}
.search-suggestion-card{
  background:#fff;border:1px solid var(--border-light);border-radius:var(--radius);
  padding:.85rem;
}
.search-bar{
  background:var(--bg-soft);border-radius:6px;padding:.55rem .75rem;
  font-size:.85rem;color:var(--text-mid);margin-bottom:.65rem;
  border-bottom:2px solid var(--accent);
}
.search-options{display:flex;flex-direction:column;gap:.35rem}
.search-options .city-chip{display:block;text-align:center}

/* UNDERLINED-TRANSLATE (L4 ex 3) */
.underlined-word{
  background:var(--accent-light);padding:1px 4px;border-radius:3px;
  text-decoration:underline;text-decoration-color:var(--accent);font-weight:500;
}
.underlined-word sup{color:var(--accent);font-weight:700;font-size:.7em;margin-right:1px}

/* DIRECTIONS-VILLAGES (L6 ex 2) */
.directions-list{display:flex;flex-direction:column;gap:.5rem}
.direction-row{
  display:flex;align-items:center;gap:.85rem;padding:.65rem .85rem;
  background:var(--bg-soft);border-radius:8px;direction:ltr;
}
.direction-label{
  min-width:80px;font-family:var(--font-en);direction:ltr;
  font-weight:700;color:var(--primary);
}
.direction-row input{flex:1}

/* TABRIZ-KANDOVAN (L6 ex 3) */
.tk-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:.5rem;
}
.tk-row{
  display:flex;align-items:center;gap:.65rem;padding:.55rem .75rem;
  background:#fff;border:1px solid var(--border-light);border-radius:8px;
}
.tk-phrase{
  flex:1;font-family:var(--font-en);direction:ltr;font-size:.85rem;
  color:var(--text-dark);
}

/* POSTER-FORM / APPLICATION-FORM */
.form-keys{
  background:var(--accent-light);border:1px solid #F4D89B;
  border-radius:var(--radius);padding:.85rem 1rem;margin-bottom:1rem;
}
.form-keys h5{
  font-size:.92rem;color:#8B5C0F;margin-bottom:.5rem;
  font-family:var(--font-fa);text-align:right;
}
.form-key{
  font-size:.82rem;padding:.25rem 0;direction:rtl;
  border-bottom:1px dashed rgba(0,0,0,0.08);
}
.form-key:last-child{border-bottom:none}
.form-key-fa{color:#8B5C0F}

.form-container{
  background:linear-gradient(135deg,var(--primary-ghost),#fff);
  border:2px solid var(--primary-pale);border-radius:var(--radius-lg);
  padding:1.5rem;
}
.form-title{
  text-align:center;font-family:var(--font-display);font-size:1.15rem;
  color:var(--primary);margin-bottom:1.25rem;
  padding-bottom:.85rem;border-bottom:2px solid var(--primary-pale);
}
.form-fields{display:flex;flex-direction:column;gap:.65rem}
.form-field{
  display:flex;align-items:center;gap:.85rem;direction:ltr;
}
.form-field label{
  min-width:200px;font-family:var(--font-en);direction:ltr;
  font-size:.85rem;color:var(--text-dark);font-weight:500;
}
.form-field input{flex:1;min-width:0}

@media (max-width:600px){
  .tk-grid{grid-template-columns:1fr}
  .form-field{flex-direction:column;align-items:stretch;gap:.25rem}
  .form-field label{min-width:0;text-align:left}
}

@media (max-width:600px){
  .match-pairs-grid{grid-template-columns:1fr}
  .sentence-builder-row{flex-wrap:wrap}
  .ability-grid{padding:.65rem}
}

@media (max-width:600px){
  .pair-cards-grid{grid-template-columns:1fr;gap:.85rem}
  .crossword-clues{grid-template-columns:1fr;gap:1rem}
  .clusters-grid{grid-template-columns:1fr 1fr}
  .cluster-display{font-size:2.4rem}
  .country-numbers-grid{grid-template-columns:1fr 1fr}
  .image-country-grid{grid-template-columns:1fr 1fr}
  .famous-people-grid{grid-template-columns:1fr 1fr}
  .route-step input{width:90px}
}

@media (max-width:600px){
  .check-if-input-inline{min-width:90px;max-width:140px}
  .letters-table-row{padding:.4rem .6rem}
  .family-jobs-row{grid-template-columns:1fr;gap:.4rem}
  .review-section-body{padding:.85rem}
  .check-if-item{padding:.85rem}
}

@media (max-width:600px){
  .matching-board{gap:.5rem}
  .matching-cell{padding:.65rem .5rem;font-size:.85rem;min-height:42px}
  .big-flashcard{padding:2rem 1.25rem;min-height:240px}
  .bf-word{font-size:2rem}
  .fillblank-card{padding:1.25rem}
  .fb-sentence{font-size:1rem;padding:1rem .75rem}
}

.letters-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1.5rem}
.letter-card{background:#fff;border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:1.5rem;text-align:center;transition:all .25s;cursor:pointer}
.letter-card:hover{border-color:var(--primary-pale);box-shadow:var(--shadow);transform:translateY(-3px)}
.letter-display{font-family:var(--font-display);font-size:4.5rem;line-height:1;margin-bottom:.4rem;direction:ltr}
.letter-display.color-1{color:var(--primary)}
.letter-display.color-2{color:var(--accent)}
.letter-display.color-3{color:var(--success-soft)}
.letter-display.color-4{color:#9B59B6}
.letter-ipa{font-family:var(--font-en);font-size:.85rem;color:var(--text-mid);margin-bottom:.85rem;direction:ltr}
.letter-fa{font-size:.78rem;color:var(--primary);margin-top:.5rem;font-weight:500}
.letter-practice-card{background:linear-gradient(135deg,var(--primary-ghost) 0%,#fff 100%);border:1px solid var(--primary-pale);border-radius:var(--radius-lg);padding:1.5rem}
.letter-practice-card h4{font-size:1rem;color:var(--primary);margin-bottom:.5rem;font-weight:600}
.letter-practice-card p{font-size:.85rem;color:var(--text-mid);margin-bottom:1rem}
.letter-practice-buttons{display:flex;gap:.5rem;flex-wrap:wrap}
.btn-practice{padding:.5rem 1rem;background:#fff;border:1px solid var(--primary-pale);border-radius:8px;cursor:pointer;font-family:var(--font-fa);font-size:.82rem;color:var(--primary);transition:all .2s}
.btn-practice:hover{background:var(--primary);color:#fff;border-color:var(--primary)}

.listen-task{background:#fff;border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:1.5rem;margin-bottom:1rem}
.listen-task-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem;direction:ltr}
.listen-task-info{text-align:left}
.listen-task-title{font-weight:600;color:var(--text-dark);font-size:.95rem;font-family:var(--font-en);direction:ltr}
.listen-task-fa{font-size:.78rem;color:var(--text-mid);margin-top:.2rem;font-family:var(--font-fa);direction:rtl;text-align:right}
.listen-task-num{font-family:var(--font-display);font-size:.85rem;color:var(--primary);background:var(--primary-ghost);padding:.25rem .75rem;border-radius:99px}
.check-table{width:100%;border-collapse:collapse;margin-top:.85rem;font-size:.85rem;direction:ltr}
.check-table th,.check-table td{padding:.65rem;border:1px solid var(--border-light);font-family:var(--font-en)}
.check-table th{background:var(--bg-soft);text-align:left;font-weight:600;font-size:.78rem;width:30%}
.check-table th .th-en{display:block;direction:ltr}
.check-table th .th-fa{display:block;font-family:var(--font-fa);direction:rtl;text-align:right;font-size:.7rem;color:var(--text-soft);font-weight:400;margin-top:2px}
.check-table td{text-align:center}
.check-cell label{display:flex;align-items:center;justify-content:center;gap:.4rem;cursor:pointer;direction:ltr}
.check-cell input{width:16px;height:16px;cursor:pointer;accent-color:var(--primary)}

.speak-write-task{background:#fff;border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:1.5rem;margin-bottom:1rem}
.speak-write-task-head{margin-bottom:1rem}
.speak-write-task h4{font-size:.95rem;font-weight:600;color:var(--text-dark);margin-bottom:.3rem;font-family:var(--font-en);direction:ltr;text-align:left}
.speak-write-task .task-fa{font-size:.82rem;color:var(--text-mid);line-height:1.6}
.fillable-table{width:100%;border-collapse:collapse;margin-top:.85rem;font-size:.85rem;direction:ltr}
.fillable-table th,.fillable-table td{padding:.65rem;border:1px solid var(--border-light);font-family:var(--font-en)}
.fillable-table th{background:var(--bg-soft);font-weight:600;font-size:.78rem;direction:ltr;text-align:center}
.fillable-table td.label-cell{text-align:left;width:35%;font-weight:600}
.fillable-table .label-fa{display:block;font-family:var(--font-fa);direction:rtl;text-align:right;font-size:.7rem;color:var(--text-soft);font-weight:400;margin-top:2px}
.fillable-input{width:100%;padding:.4rem .55rem;border:1px solid var(--border-light);border-radius:6px;font-family:var(--font-en);direction:ltr;font-size:.85rem;background:transparent;text-align:left}
.fillable-input:focus{outline:none;border-color:var(--primary);background:var(--primary-ghost)}
.dialog-template{background:var(--bg-soft);border-radius:var(--radius);padding:1rem;font-family:var(--font-en);direction:ltr;font-size:.9rem;line-height:2;margin-top:1rem;text-align:left}

.workbook-info{display:flex;gap:.85rem;align-items:flex-start;padding:1rem 1.2rem;background:var(--accent-light);border-radius:var(--radius);margin-bottom:1.5rem;border-right:3px solid var(--accent)}
.workbook-info svg{width:18px;height:18px;color:var(--accent);flex-shrink:0;margin-top:2px}
.workbook-info p{font-size:.85rem;color:var(--text-dark);line-height:1.7}
.wb-task{background:#fff;border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:1.5rem;margin-bottom:1rem}
.wb-task-head{display:flex;margin-bottom:1rem;align-items:flex-start;gap:1rem;flex-wrap:wrap}
.wb-task-num{font-family:var(--font-display);font-size:1rem;color:#fff;font-weight:700;flex-shrink:0;background:var(--primary);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.wb-task-body{flex:1;min-width:0}
.wb-task-title{font-size:.85rem;color:var(--text-dark);line-height:1.7;font-weight:600;margin-bottom:.25rem}
.wb-task-en{font-family:var(--font-en);direction:ltr;color:var(--text-mid);font-size:.8rem;line-height:1.5;text-align:left}
.wb-section-tag{font-size:.65rem;color:var(--primary);background:var(--primary-ghost);padding:.15rem .55rem;border-radius:99px;margin-right:.5rem;font-family:var(--font-en);direction:ltr;display:inline-block;letter-spacing:.05em;text-transform:uppercase}
.reading-passage{background:linear-gradient(180deg,var(--bg-soft) 0%,#fff 100%);border:1px solid var(--border-light);border-radius:var(--radius);padding:1.5rem;margin-top:1rem;font-family:var(--font-en);direction:ltr;font-size:.92rem;line-height:2;color:var(--text-dark);text-align:left}
.reading-passage .highlight-target{color:var(--primary);font-weight:600;background:var(--accent-light);padding:1px 4px;border-radius:3px;cursor:pointer;border-bottom:1px dashed var(--primary)}
.checkbox-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.65rem;margin-top:1rem}
.checkbox-item{display:flex;align-items:center;gap:.6rem;padding:.7rem .9rem;background:var(--bg-soft);border:1px solid var(--border-light);border-radius:8px;cursor:pointer;transition:all .2s}
.checkbox-item:hover{border-color:var(--primary-pale);background:var(--primary-ghost)}
.checkbox-item input{width:16px;height:16px;cursor:pointer;accent-color:var(--primary);flex-shrink:0}
.checkbox-item label{font-family:var(--font-en);direction:ltr;font-size:.9rem;color:var(--text-dark);cursor:pointer;flex:1}
.match-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:.5rem;margin-top:1rem}
.match-item{padding:.7rem .9rem;background:var(--bg-soft);border:1px solid var(--border-light);border-radius:8px;font-family:var(--font-en);direction:ltr;font-size:.85rem;cursor:pointer;transition:all .2s;text-align:center}
.match-item:hover{border-color:var(--primary-pale);background:var(--primary-ghost)}
.dropzone-pair{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem}
.dropzone{border-radius:var(--radius);padding:1rem;min-height:120px;direction:ltr}
.dropzone.girl{background:#FCE9F3;border:2px dashed #E195C0}
.dropzone.boy{background:var(--primary-ghost);border:2px dashed var(--primary-pale)}
.dropzone h5{text-align:center;margin-bottom:.85rem;font-family:var(--font-en);font-size:.9rem;direction:ltr}
.dropzone.girl h5{color:#A33B6E}
.dropzone.boy h5{color:var(--primary)}
.dropzone-placeholder{font-family:var(--font-en);direction:ltr;font-size:.78rem;color:var(--text-soft);text-align:center}
.id-card-form{max-width:380px;margin:1rem auto 0;background:linear-gradient(135deg,var(--primary-ghost) 0%,#fff 100%);border:2px solid var(--primary-pale);border-radius:var(--radius);padding:1.25rem;direction:ltr}
.id-card-form-head{text-align:center;font-family:var(--font-en);color:var(--primary);font-weight:600;margin-bottom:1rem}
.id-card-form .form-row{margin-bottom:.85rem}
.id-card-form label{font-size:.78rem;color:var(--text-mid);display:block;margin-bottom:.25rem;font-family:var(--font-en);direction:ltr;text-align:left}
.id-card-form input{width:100%;padding:.55rem .75rem;border:1px solid var(--border-light);border-radius:6px;font-family:var(--font-en);direction:ltr;font-size:.9rem;background:#fff;text-align:left}
.placeholder-msg{padding:2rem;text-align:center;color:var(--text-soft);background:var(--bg-soft);border-radius:var(--radius);font-size:.9rem}

/* ═══════════════════════════════════════════════
   WORKBOOK SHARED COMPONENTS
   ═══════════════════════════════════════════════ */
.wb-input{
  width:100%;padding:.5rem .7rem;border:1px solid var(--border-light);border-radius:6px;
  font-family:var(--font-en);direction:ltr;font-size:.88rem;background:#fff;text-align:left;
  box-sizing:border-box;min-width:0;
}
.wb-input:focus{outline:none;border-color:var(--primary);background:var(--primary-ghost)}
.wb-input.wb-input-sm{max-width:120px;text-align:center}
.wb-input.wb-input-grow{flex:1}
.wb-input.wb-input-center{text-align:center}
textarea.wb-input{font-family:var(--font-fa);direction:rtl;text-align:right;resize:vertical}
.wb-input.answer-correct{background:var(--success-bg);border-color:var(--success);color:var(--success);font-weight:600}
.wb-input.answer-wrong{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.wb-input.answer-empty{background:var(--accent-light);border-color:var(--accent);color:#8B5C0F}

.wb-select{
  padding:.5rem .55rem;border:1px solid var(--border-light);border-radius:6px;
  font-family:var(--font-en);direction:ltr;font-size:.85rem;background:#fff;cursor:pointer;
  margin-left:.4rem;
}

.wb-table{
  width:100%;border-collapse:collapse;margin-top:.5rem;font-size:.85rem;direction:ltr;
}
.wb-table th,.wb-table td{padding:.6rem;border:1px solid var(--border-light);text-align:left}
.wb-table th{background:var(--bg-soft);font-weight:600;font-size:.78rem;font-family:var(--font-en)}
.wb-table .label-fa{font-family:var(--font-fa);direction:rtl;font-size:.7rem;color:var(--text-soft);margin-right:.4rem}

.wb-hint{
  font-size:.78rem;color:var(--text-mid);margin-top:.85rem;
  padding:.6rem .85rem;background:var(--bg-soft);border-radius:6px;
  border-right:3px solid var(--success-soft);line-height:1.7;
}
.wb-hint strong{color:var(--success)}

.wb-show-answers-btn{
  margin-top:1rem;padding:.55rem 1.2rem;background:var(--accent);color:#fff;border:none;
  border-radius:8px;cursor:pointer;font-family:var(--font-fa);font-size:.82rem;font-weight:500;
}
.wb-show-answers-btn:hover{background:#D88B19}
.wb-show-answers-btn:disabled{background:var(--success);cursor:default;opacity:.85}

/* GROUP-MATCH (L2) */
.groups-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.85rem;margin-bottom:1rem}
.group-card{background:var(--bg-soft);border:1px solid var(--border-light);border-radius:var(--radius);overflow:hidden}
.group-card.has-target{border-color:var(--accent);background:var(--accent-light)}
.group-card-head{background:var(--primary);color:#fff;padding:.55rem .85rem;font-weight:600;text-align:center;font-family:var(--font-en);direction:ltr}
.group-card.has-target .group-card-head{background:var(--accent);color:#042C53}
.group-card-list{list-style:none;padding:.5rem .85rem;margin:0;font-family:var(--font-en);direction:ltr;font-size:.85rem}
.group-card-list li{padding:.2rem 0;color:var(--text-dark)}
.group-card-list li.target-member{font-weight:700;color:var(--accent);background:#fff;padding:.2rem .55rem;border-radius:4px;margin:.15rem 0}
.wb-mini-form{margin-top:1rem;padding:1rem;background:var(--bg-soft);border-radius:var(--radius)}
.wb-mini-form label{display:flex;align-items:center;gap:.5rem;font-size:.85rem;margin-bottom:.85rem;direction:ltr;font-family:var(--font-en)}
.wb-list{display:flex;flex-direction:column;gap:.4rem}
.wb-list-row{display:flex;align-items:center;gap:.5rem}
.wb-list-num{font-weight:600;color:var(--primary);min-width:24px;font-family:var(--font-en)}

/* SORT-ALPHABETICAL (L2) */
.books-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.85rem}
.book-card{background:#fff;border:1px solid var(--border-light);border-radius:var(--radius);padding:.85rem;text-align:center}
.book-cover{
  background:linear-gradient(135deg,var(--primary-ghost),#fff);
  border-radius:var(--radius);padding:.85rem .5rem;margin-bottom:.55rem;
  font-family:var(--font-en);direction:ltr;font-size:.78rem;color:var(--text-dark);min-height:80px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.3rem;
}
.book-cover span{font-weight:600;line-height:1.3}
.book-order-input{
  width:60px;padding:.4rem;border:1px solid var(--border-light);border-radius:6px;
  font-family:var(--font-en);font-size:.95rem;text-align:center;font-weight:600;
}

/* WORD-BUILDER & INTERNATIONAL-WORDS */
.letter-bag{
  display:flex;gap:.4rem;flex-wrap:wrap;padding:.85rem 1rem;
  background:linear-gradient(135deg,var(--accent-light),#fff);
  border:1px dashed var(--accent);border-radius:var(--radius);justify-content:center;
}
.letter-chip{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;background:#fff;border:1px solid var(--accent);
  border-radius:8px;font-family:var(--font-en);direction:ltr;font-weight:700;
  color:var(--accent);font-size:1rem;
}
.word-slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.5rem}
.word-slot{display:flex;align-items:center;gap:.5rem}
.word-slot-bullet{color:var(--primary);font-size:1rem}
.international-words-table .iw-example{
  background:var(--primary-ghost);font-family:var(--font-en);direction:ltr;
  font-weight:600;color:var(--primary);text-align:center;
}

/* MARTYRS */
.martyrs-list{display:flex;flex-direction:column;gap:.85rem}
.martyr-row{
  display:flex;align-items:center;gap:1rem;padding:.85rem;
  background:linear-gradient(135deg,var(--success-bg),#fff);
  border:1px solid #B5D88A;border-radius:var(--radius);
}
.martyr-photo{
  width:48px;height:48px;background:#fff;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0;
}
.martyr-name{flex:1;display:flex;align-items:center;gap:.85rem;flex-wrap:wrap}
.martyr-firstname{font-family:var(--font-en);direction:ltr;font-weight:600;color:var(--text-dark)}
.martyr-input{flex:1;min-width:140px}

/* MATCH-LINE */
.match-line-container{display:grid;grid-template-columns:1fr 2fr;gap:1rem;align-items:start}
.match-line-left{display:flex;flex-direction:column;gap:.5rem}
.match-line-item{
  padding:.6rem .85rem;background:var(--bg-soft);border:1px dashed var(--border);
  border-radius:var(--radius);font-size:.85rem;cursor:pointer;
}
.match-line-item:hover{border-color:var(--primary)}
.number-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:.25rem}
.num-cell{
  padding:.5rem;background:#fff;border:1px solid var(--border-light);
  border-radius:6px;text-align:center;font-family:var(--font-en);font-weight:600;
  cursor:pointer;font-size:.85rem;
}
.num-cell:hover{background:var(--primary-ghost);border-color:var(--primary)}
.months-card{background:#fff;border:1px solid var(--border-light);border-radius:var(--radius);padding:.85rem}
.months-card-head{font-family:var(--font-en);direction:ltr;font-weight:600;text-align:center;color:var(--primary);margin-bottom:.5rem;padding-bottom:.5rem;border-bottom:1px solid var(--border-light)}
.months-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.25rem}
.month-cell{
  padding:.4rem .55rem;background:var(--bg-soft);border-radius:4px;
  font-family:var(--font-en);direction:ltr;font-size:.78rem;cursor:pointer;text-align:center;
}
.month-cell:hover{background:var(--primary-ghost)}

/* DATE-OCCASION */
.occasions-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.85rem}
.occasion-card{
